version: "2"

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - contextcheck
    - copyloopvar
    - dogsled
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - funlen
    - gochecknoinits
    - gocognit
    - gocyclo
    - gomodguard
    - goprintffuncname
    - govet
    - gosec
    - ineffassign
    - makezero
    - misspell
    - mnd
    - nakedret
    - nolintlint
    - noctx
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - whitespace
    - wrapcheck
  disable:
    # Disabled overly strict/cosmetic linters
    - wsl
    - dupl
    - err113
    - paralleltest
    # Disabled stylistic linters - focus on real bugs and complexity
    - gocritic # Too many style suggestions
    - nlreturn # Blank line before return - cosmetic
    - godot # Comment punctuation - cosmetic
    - godox # TODO comments are fine
    - nestif # Nested if complexity - covered by gocognit
    - forbidigo # fmt.Print in config/tests is acceptable
    - gochecknoglobals # Global vars in tests/metrics are fine
    - goconst # Repeated strings in tests are acceptable
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    errorlint:
      errorf: true
    wrapcheck:
      ignore-package-globs:
        - os
        - net
        - encoding/*
        - crypto/*
        - io
        - github.com/jackc/pgx/*
        - github.com/testcontainers/*
        - github.com/cenkalti/backoff/*
        - github.com/TakuyaYagam1/AstroCTFb/internal/repo
        - github.com/TakuyaYagam1/AstroCTFb/internal/storage
        - github.com/TakuyaYagam1/AstroCTFb/pkg/*
        - github.com/go-playground/*
        - golang.org/x/crypto/*
        - golang.org/x/sync/*
        - github.com/Masterminds/*
        - github.com/TakuyaYagam1/AstroCTFb/internal/usecase/*
        - github.com/ulule/*
    exhaustive:
      default-signifies-exhaustive: false
    funlen:
      lines: 150
      statements: 70
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 18
    misspell:
      locale: US
    nolintlint:
      require-explanation: false
      require-specific: true
    gosec:
      excludes:
        - G101
        - G117
    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "10"
        - "100"
      ignored-files:
        - ".*_test\\.go"
    revive:
      rules:
        - name: exported
          severity: warning
        - name: var-naming
          severity: warning
        - name: unexported-return
          severity: warning
        - name: unused-parameter
          severity: warning
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters: [gosec]
        path: e2e-test/
        text: "G704"
      - linters: [wrapcheck]
        path: e2e-test/
      - linters: [wrapcheck]
        path: integration-test/
      - linters: [wrapcheck]
        path: internal/repo/
      - linters: [wrapcheck]
        path: internal/wire/
      - linters: [wrapcheck]
        path: internal/app/
      - linters: [wrapcheck]
        path: internal/storage/
      - linters: [wrapcheck]
        path: pkg/
      - linters: [wrapcheck]
        path: config/
      - linters: [wrapcheck]
        path: internal/controller/
      - linters: [mnd]
        path: e2e-test/
      - linters: [mnd]
        path: integration-test/
      - linters: [revive]
        path: e2e-test/
      - linters: [revive]
        path: integration-test/
      - linters: [unconvert]
        path: e2e-test/
      - linters: [contextcheck]
        path: integration-test/
      - linters: [contextcheck]
        path: load-test/
      - linters: [contextcheck]
        path: internal/app/
      - linters: [contextcheck]
        path: internal/controller/
      - linters: [contextcheck]
        path: internal/usecase/
      - linters: [funlen]
        path: config/
      - linters: [gocognit]
        path: config/
      - linters: [gocognit]
        path: internal/
      - linters: [gocyclo]
        path: config/
      - linters: [gocyclo]
        path: internal/
      - linters: [gocyclo]
        path: pkg/
      - linters: [mnd]
        path: config/
      - linters: [mnd]
        path: internal/
      - linters: [mnd]
        path: pkg/
      - linters: [mnd]
        path: cmd/
      - linters: [revive]
        path: internal/domain/
      - linters: [revive]
        path: internal/usecase/
      - linters: [revive]
        path: pkg/crypto/
      - linters: [unparam]
        path: internal/usecase/
    paths:
      - bin/
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/TakuyaYagam1
  exclusions:
    generated: lax
    paths:
      - bin/
      - third_party$
      - builtin$
      - examples$
