# supported golangci-lint version = 2.11.4
version: "2"
linters:
  default: all
  disable:
    - containedctx
    - contextcheck
    - cyclop
    - depguard
    - dogsled
    - dupl
    - err113
    - exhaustruct
    - forcetypeassert
    - forbidigo
    - funcorder
    - funlen
    - gochecknoglobals
    - gocognit
    - gocheckcompilerdirectives
    - goconst
    - gocyclo
    - godoclint
    - gomoddirectives
    - gosmopolitan
    - errchkjson
    - iface
    - interfacebloat
    - intrange
    - ireturn
    - lll
    - mnd
    - nestif
    - nilnil
    - noctx
    - nilerr
    - noinlineerr
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - testpackage
    - unconvert
    - unparam
    - usetesting
    - maintidx
    - varnamelen
    - wrapcheck
    - wsl
    - nolintlint

  settings:
    cyclop:
      max-complexity: 15
    gocritic:
      enable-all: true
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - importShadow
        - captLocal
        - whyNoLint
        - unnamedResult
        - typeDefFirst
        - ifElseChain
        - typeAssertChain
        - typeUnparen
        - emptyStringTest
        - tooManyResultsChecker
        - deferInLoop
        - exitAfterDefer
    gosec:
      excludes:
        - G101
        - G104
        - G115
        - G117
        - G118
        - G703
        - G705
    nestif:
      min-complexity: 7
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    reassign:
      patterns:
        - .*
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    prealloc:
      for-loops: true
    nilnil:
      detect-opposite: true
    revive:
      enable-all-rules: true
      rules:
        - name: unexported-return
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: add-constant
          disabled: true
        - name: unhandled-error
          arguments:
            - "^fmt\\.(F|S)?Print.*"
            - "strings.Builder.Write.*"
            - "bytes.Buffer.Write.*"
            - "io.PipeWriter.CloseWithError"
            - "os.Setenv"
            - "os.Unsetenv"
            - "io.Closer.Close"
        - name: var-naming
          disabled: true
        - name: nested-structs
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: function-length
          disabled: true
        - name: import-shadowing
          disabled: true
        - name: import-alias-naming
          arguments:
            - allow-regex: "^([a-z][a-z0-9]*(_[a-z0-9]+)*)|([A-Z][A-Z0-9]*)$"
        - name: empty-block
          disabled: true
        - name: confusing-naming
          disabled: true
        - name: confusing-results
          disabled: true
        - name: unexported-naming
          disabled: true
        - name: unused-parameter
          disabled: true
        - name: use-errors-new
          disabled: true
        - name: unnecessary-format
          disabled: true
        - name: redundant-test-main-exit
          disabled: true
        - name: redundant-import-alias
          disabled: true
        - name: function-result-limit
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: context-as-argument
          disabled: true
        - name: blank-imports
          disabled: true
        - name: use-waitgroup-go
          disabled: true
        - name: enforce-switch-style
          disabled: true
        - name: identical-switch-branches
          disabled: true
        - name: defer
          disabled: true
        - name: superfluous-else
          disabled: true
        - name: unnecessary-stmt
          disabled: true
        - name: bool-literal-in-expr
          disabled: true
        - name: deep-exit
          disabled: true
        - name: unchecked-type-assertion
          disabled: true
        - name: max-control-nesting
          disabled: true
        - name: exported
          disabled: true
        - name: unused-receiver
          disabled: true
        - name: indent-error-flow
          disabled: true
        - name: early-return
          disabled: true
        - name: argument-limit
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: get-return
          disabled: true
        - name: struct-tag
          disabled: true
        - name: package-naming
          arguments:
            - convention-name-check-regex: "^([a-z][a-z0-9]*(_[a-z0-9]+)*)|([A-Z][A-Z0-9]*)$"
    testifylint:
      enable-all: true
    usestdlibvars:
      time-date-month: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - io.Close
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - (*archive/zip.Writer).Close
        - (*io.PipeWriter).Close
        - (github.com/jackc/pgx/v5.BatchResults).Close
    staticcheck:
      checks:
        - all
        - -S1008
        - -SA9003
        - -ST1003
    tagliatelle:
      case:
        rules:
          avro: snake
          bson: snake
          env: upperSnake
          envconfig: upperSnake
          json: snake
          mapstructure: snake
          toml: snake
          whatever: snake
          xml: snake
          yaml: snake
    wsl_v5:
      allow-first-in-block: false

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
    rules:
      - linters: [gosec]
        path: e2e-test/
      - linters: [gosec]
        path: integration-test/
      - linters: [gosec]
        path: load-test/
      - linters: [errcheck, goconst, errname, unparam, testifylint]
        path: _test\.go
      - linters: [errcheck, goconst, errname]
        path: e2e-test/
      - linters: [errcheck, goconst, errname]
        path: integration-test/
      - linters: [errcheck, goconst, errname]
        path: load-test/

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/TakuyaYagam1
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-same-issues: 0

run:
  relative-path-mode: gomod
