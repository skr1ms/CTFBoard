CreateChallengeRequest:
  properties:
    category:
      example: Web
      type: string
      x-oapi-codegen-extra-tags:
        validate: required,challenge_category
    decay:
      example: 20
      minimum: 0
      type: integer
    connection_info:
      description: Connection info (e.g. SSH, URL) for the challenge
      example: ''
      type: string
    max_attempts:
      description: Max submission attempts per team (0 = unlimited)
      example: 0
      minimum: 0
      type: integer
    max_attempts_window:
      description: Rolling window in seconds for max_attempts cooldown (0 = permanent lockout)
      example: 0
      minimum: 0
      type: integer
    position:
      description: Display order (lower = first)
      example: 0
      minimum: 0
      type: integer
    description:
      example: Challenge description
      type: string
      x-oapi-codegen-extra-tags:
        validate: required,challenge_description
    flag:
      example: CTF{flag_here}
      type: string
      x-oapi-codegen-extra-tags:
        validate: required,challenge_flag
    flag_format_regex:
      description: Optional regex for flag format validation for this challenge; overrides competition default
      example: ^CTF\{[a-zA-Z0-9_]+\}$
      maxLength: 1024
      type: string
    initial_value:
      example: 500
      minimum: 0
      type: integer
    is_case_insensitive:
      example: false
      type: boolean
    is_regex:
      example: false
      type: boolean
    min_value:
      example: 100
      minimum: 0
      type: integer
    points:
      example: 100
      minimum: 0
      type: integer
    state:
      description: Challenge visibility and submit policy
      enum:
      - visible
      - hidden
      - locked
      example: visible
      type: string
    tag_ids:
      description: Tag IDs for the challenge
      items:
        type: string
      type: array
    title:
      example: Challenge 1
      type: string
      x-oapi-codegen-extra-tags:
        validate: required,challenge_title
  required:
  - category
  - description
  - flag
  - points
  - title
  type: object
