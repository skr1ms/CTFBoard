schemas:
  response.NotificationResponse:
    properties:
      id:
        type: string
      title:
        type: string
      content:
        type: string
      type:
        type: string
      is_pinned:
        type: boolean
      created_at:
        type: string
    type: object
  response.NotificationCountResponse:
    properties:
      count:
        type: integer
    type: object
  response.NotificationDeliveryResponse:
    properties:
      target_type:
        type: string
      target_id:
        type: string
      created_count:
        type: integer
    type: object
  response.UserNotificationResponse:
    properties:
      id:
        type: string
      title:
        type: string
      content:
        type: string
      type:
        type: string
      is_read:
        type: boolean
      created_at:
        type: string
    type: object
  response.NotificationUnreadCountResponse:
    properties:
      unread_count:
        type: integer
    type: object
  request.CreateNotificationRequest:
    properties:
      title:
        type: string
        maxLength: 200
        x-oapi-codegen-extra-tags:
          validate: "required,max=200"
      content:
        type: string
        maxLength: 5000
        x-oapi-codegen-extra-tags:
          validate: "required,max=5000"
      type:
        type: string
        enum: [info, warning, success, error]
        default: info
        x-oapi-codegen-extra-tags:
          validate: "omitempty,oneof=info warning success error"
      is_pinned:
        type: boolean
        default: false
    required:
      - title
      - content
    type: object
  request.CreateUserNotificationRequest:
    properties:
      title:
        type: string
        maxLength: 200
        x-oapi-codegen-extra-tags:
          validate: "required,max=200"
      content:
        type: string
        maxLength: 5000
        x-oapi-codegen-extra-tags:
          validate: "required,max=5000"
      type:
        type: string
        enum: [info, warning, success, error]
        default: info
        x-oapi-codegen-extra-tags:
          validate: "omitempty,oneof=info warning success error"
    required:
      - title
      - content
    type: object
  request.UpdateNotificationRequest:
    properties:
      title:
        type: string
        maxLength: 200
        x-oapi-codegen-extra-tags:
          validate: "required,max=200"
      content:
        type: string
        maxLength: 5000
        x-oapi-codegen-extra-tags:
          validate: "required,max=5000"
      type:
        type: string
        enum: [info, warning, success, error]
        x-oapi-codegen-extra-tags:
          validate: "omitempty,oneof=info warning success error"
      is_pinned:
        type: boolean
    required:
      - title
      - content
    type: object
