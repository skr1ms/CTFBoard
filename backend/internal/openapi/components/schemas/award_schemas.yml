schemas:
  response.AwardResponse:
    properties:
      id:
        type: string
      team_id:
        type: string
      value:
        type: integer
      description:
        type: string
      created_at:
        type: string
        format: date-time
      created_by:
        type: string
        nullable: true
    type: object
  request.CreateAwardRequest:
    properties:
      team_id:
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,uuid"
      value:
        type: integer
        minimum: 0
        x-oapi-codegen-extra-tags:
          validate: "min=0"
      description:
        type: string
        maxLength: 500
        x-oapi-codegen-extra-tags:
          validate: "required,max=500"
    required:
      - team_id
      - value
      - description
    type: object
