        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=0"
      state:
        description: Challenge visibility and submit policy
        enum: [visible, hidden, locked]
        example: visible
        type: string
        x-oapi-codegen-extra-tags:
          validate: "omitempty,oneof=visible hidden locked"
      tag_ids:
        description: Tag IDs for the challenge
        items:
          type: string
        type: array
      title:
        example: Updated title
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,challenge_title"
    required:
      - category
      - description
      - points
      - title
    type: object
  request.SubmitFlagRequest:
    properties:
      flag:
        example: CTF{flag_here}
        maxLength: 200
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,challenge_flag"
    required:
      - flag
    type: object
  request.CreateHintRequest:
    properties:
      title:
        example: ''
        type: string
      content:
        example: This is a hint
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,hint_content"
      cost:
        example: 50
