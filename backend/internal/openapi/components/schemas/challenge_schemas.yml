        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=0"
      description:
        example: Updated description
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,challenge_description"
      flag:
        description: Single v1 answer for the challenge. When `is_regex` is false this value is hashed; when `is_regex` is true this value is stored as encrypted regex material.
        example: CTF{new_flag}
        type: string
        x-oapi-codegen-extra-tags:
          validate: "omitempty,challenge_flag"
      flag_format_regex:
        description: Optional regex for flag format validation for this challenge; overrides competition default. Omit to keep current value, send null to clear.
        example: '^CTF\{[a-zA-Z0-9_]+\}$'
        maxLength: 1024
        type: string
        nullable: true
        x-go-type: nullable.Nullable[string]
        x-go-type-skip-optional-pointer: true
        x-oapi-codegen-extra-tags:
          validate: "omitempty,max=1024"
      initial_value:
        example: 500
        minimum: 0
        type: integer
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=0"
      is_case_insensitive:
        example: false
        type: boolean
      is_regex:
        example: false
        type: boolean
      min_value:
        example: 100
        minimum: 0
        type: integer
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=0"
      points:
        example: 150
        minimum: 0
        type: integer
        x-oapi-codegen-extra-tags:
          validate: "min=0"
      connection_info:
        description: Connection info (e.g. SSH, URL) for the challenge
        example: ''
        type: string
      attribution:
        description: Optional author, sponsor, or source attribution shown with the challenge
        example: ''
        type: string
      max_attempts:
        description: Max submission attempts per team (0 = unlimited)
        example: 0
        minimum: 0
        type: integer
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=0"
      max_attempts_window:
        description: Rolling window in seconds for max_attempts cooldown (0 = permanent lockout)
        example: 0
        minimum: 0
        type: integer
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=0"
      position:
        description: Display order (lower = first)
        example: 0
        minimum: 0
        type: integer
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=0"
      next_id:
        description: Optional next challenge navigation pointer. Send null to clear the pointer.
        type: string
        format: uuid
        nullable: true
        x-go-type: nullable.Nullable[openapi_types.UUID]
        x-go-type-skip-optional-pointer: true
      state:
        description: Challenge visibility and submit policy
        enum: [visible, hidden, locked]
        example: visible
        type: string
        x-oapi-codegen-extra-tags:
          validate: "omitempty,oneof=visible hidden locked"
      tag_ids:
        description: Tag IDs for the challenge
        items:
          type: string
        type: array
      title:
        example: Updated title
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,challenge_title"
    required:
      - category
      - description
      - points
      - title
    type: object
  request.SubmitFlagRequest:
    properties:
      flag:
        description: Submitted candidate for the challenge's single v1 answer. Partial submissions and multi-flag groups are not supported in v1.
        example: CTF{flag_here}
        maxLength: 200
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,challenge_flag"
    required:
      - flag
    type: object
  request.CreateHintRequest:
    properties:
      title:
        example: ''
