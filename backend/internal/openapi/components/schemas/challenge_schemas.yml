    type: object
  request.UpdateHintRequest:
    properties:
      title:
        example: ''
        type: string
      content:
        example: Updated hint content
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,hint_content"
      cost:
        example: 100
        minimum: 0
        type: integer
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=0"
      order_index:
        example: 1
        minimum: 0
        type: integer
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=0"
    required:
      - content
    type: object
  request.CreateCommentRequest:
    properties:
      content:
