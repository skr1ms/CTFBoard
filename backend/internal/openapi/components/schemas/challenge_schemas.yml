schemas:
  ChallengeExport:
    properties:
      id:
        type: string
      title:
        type: string
      description:
        type: string
      category:
        type: string
      points:
        type: integer
      initial_value:
        type: integer
      min_value:
        type: integer
      decay:
        type: integer
      solve_count:
        type: integer
      flag_hash:
        type: string
      flag_regex:
        type: string
      state:
        type: string
        enum:
          - visible
          - hidden
          - locked
      attribution:
        type: string
      connection_info:
        type: string
      max_attempts:
        type: integer
      max_attempts_window:
        type: integer
        format: int64
      position:
        type: integer
      next_id:
        type: string
        format: uuid
        nullable: true
      is_regex:
        type: boolean
      is_case_insensitive:
        type: boolean
      flag_format_regex:
        type: string
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      hints:
        type: array
        items:
          $ref: "#/schemas/Hint"
      tag_ids:
        type: array
        items:
          type: string
          format: uuid
      topic_ids:
        type: array
        items:
          type: string
          format: uuid
    type: object
  Hint:
    properties:
      id:
        type: string
      challenge_id:
        type: string
      content:
        type: string
      title:
        type: string
      cost:
        type: integer
      order_index:
        type: integer
    type: object
  Solve:
    properties:
      id:
        type: string
      user_id:
        type: string
      team_id:
        type: string
      challenge_id:
        type: string
      solved_at:
        type: string
        format: date-time
      points_at_solve:
        type: integer
      banned_team_id:
        type: string
        format: uuid
        nullable: true
      banned_user_id:
        type: string
        format: uuid
        nullable: true
    type: object
  request.CreateChallengeRequest:
    properties:
      category:
        example: Web
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,challenge_category"
      decay:
        example: 20
        minimum: 0
        type: integer
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=0"
      connection_info:
        description: Connection info (e.g. SSH, URL) for the challenge
        example: ''
        type: string
      attribution:
        description: Optional author, sponsor, or source attribution shown with the challenge
        example: ''
        type: string
      max_attempts:
        description: Max submission attempts per team (0 = unlimited)
        example: 0
        minimum: 0
        type: integer
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=0"
      max_attempts_window:
        description: Rolling window in seconds for max_attempts cooldown (0 = permanent lockout)
        example: 0
        minimum: 0
        type: integer
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=0"
      position:
        description: Display order (lower = first)
        example: 0
        minimum: 0
        type: integer
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=0"
      next_id:
        description: Optional next challenge navigation pointer
        type: string
        format: uuid
        nullable: true
      description:
        example: Challenge description
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,challenge_description"
      flag:
        description: Single v1 answer for the challenge. When `is_regex` is false this value is hashed; when `is_regex` is true this value is stored as encrypted regex material.
        example: CTF{flag_here}
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,challenge_flag"
      flag_format_regex:
        description: Optional regex for flag format validation for this challenge; overrides competition default
        example: '^CTF\{[a-zA-Z0-9_]+\}$'
        maxLength: 1024
        type: string
        x-oapi-codegen-extra-tags:
          validate: "omitempty,max=1024"
      initial_value:
        example: 500
        minimum: 0
        type: integer
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=0"
      is_case_insensitive:
        example: false
        type: boolean
      is_regex:
        example: false
        type: boolean
      min_value:
        example: 100
        minimum: 0
        type: integer
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=0"
      points:
        example: 100
        minimum: 0
        type: integer
        x-oapi-codegen-extra-tags:
          validate: "min=0"
      state:
        description: Challenge visibility and submit policy
        enum: [visible, hidden, locked]
        example: visible
        type: string
        x-oapi-codegen-extra-tags:
          validate: "omitempty,oneof=visible hidden locked"
      tag_ids:
        description: Tag IDs for the challenge
        items:
          type: string
        type: array
      title:
        example: Challenge 1
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,challenge_title"
    required:
      - category
      - description
      - flag
      - points
      - title
    type: object
  request.UpdateChallengeRequest:
    properties:
      category:
        example: Web
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,challenge_category"
      decay:
        example: 20
        minimum: 0
