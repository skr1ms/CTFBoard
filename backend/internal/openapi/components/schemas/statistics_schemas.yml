schemas:
  GeneralStats:
    properties:
      challenge_count:
        type: integer
      solve_count:
        type: integer
      team_count:
        type: integer
      user_count:
        type: integer
    type: object
  ChallengeStats:
    properties:
      category:
        type: string
      id:
        type: string
      points:
        type: integer
      solve_count:
        type: integer
      title:
        type: string
    type: object
  ChallengeSolveEntry:
    properties:
      team_id:
        type: string
      team_name:
        type: string
      solved_at:
        type: string
        format: date-time
    type: object
  ChallengeDetailStats:
    properties:
      id:
        type: string
      title:
        type: string
      category:
        type: string
      points:
        type: integer
      solve_count:
        type: integer
      total_teams:
        type: integer
      percentage_solved:
        type: number
      first_blood:
        $ref: "#/schemas/ChallengeSolveEntry"
      solves:
        type: array
        items:
          $ref: "#/schemas/ChallengeSolveEntry"
    type: object
  ChallengeSolvePercentage:
    properties:
      id:
        type: string
      title:
        type: string
      category:
        type: string
      solve_count:
        type: integer
      total_teams:
        type: integer
      percentage:
        type: number
    type: object
  ScoreDistributionBucket:
    properties:
      bucket:
        type: string
      count:
        type: integer
    type: object
  SubmissionTimeSeries:
    properties:
      date:
        type: string
        format: date
      correct:
        type: integer
      incorrect:
        type: integer
    type: object
  response.SubmissionTimeSeriesResponse:
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/SubmissionTimeSeries"
      total_correct:
        type: integer
      total_incorrect:
        type: integer
    type: object
  RegistrationTimePoint:
    properties:
      date:
        type: string
        format: date
      count:
        type: integer
    type: object
  SolveMatrixRow:
    properties:
      team_id:
        type: string
        format: uuid
      team_name:
        type: string
      challenge_id:
        type: string
        format: uuid
      challenge_title:
        type: string
      challenge_category:
        type: string
      solved:
        type: boolean
      solved_at:
        type: string
        format: date-time
        nullable: true
    type: object
  FunnelChallengeRow:
    properties:
      challenge_id:
        type: string
        format: uuid
      challenge_title:
        type: string
      challenge_category:
        type: string
      opened_count:
        type: integer
      attempted_count:
        type: integer
      solved_count:
        type: integer
    type: object
  FunnelTeamRow:
    properties:
      team_id:
        type: string
        format: uuid
      team_name:
        type: string
      opened_count:
        type: integer
      attempted_count:
        type: integer
      solved_count:
        type: integer
    type: object
  FunnelTeamCell:
    properties:
      team_id:
        type: string
        format: uuid
      challenge_id:
        type: string
        format: uuid
      opened:
        type: boolean
      attempted:
        type: boolean
      solved:
        type: boolean
      first_opened_at:
        type: string
        format: date-time
        nullable: true
      first_attempted_at:
        type: string
        format: date-time
        nullable: true
      solved_at:
        type: string
        format: date-time
        nullable: true
    type: object
  FunnelUserRow:
    properties:
      user_id:
        type: string
        format: uuid
      username:
        type: string
      opened_count:
        type: integer
      attempted_count:
        type: integer
      solved_count:
        type: integer
    type: object
  FunnelUserCell:
    properties:
      user_id:
        type: string
        format: uuid
      challenge_id:
        type: string
        format: uuid
      opened:
        type: boolean
      attempted:
        type: boolean
      solved:
        type: boolean
      first_opened_at:
        type: string
        format: date-time
        nullable: true
      first_attempted_at:
        type: string
        format: date-time
        nullable: true
      solved_at:
        type: string
        format: date-time
        nullable: true
    type: object
  AdminStatisticsFunnel:
    properties:
      challenges:
        type: array
        items:
          $ref: "#/schemas/FunnelChallengeRow"
      teams:
        type: array
        items:
          $ref: "#/schemas/FunnelTeamRow"
      team_cells:
        type: array
        items:
          $ref: "#/schemas/FunnelTeamCell"
      users:
        type: array
        items:
          $ref: "#/schemas/FunnelUserRow"
      user_cells:
        type: array
        items:
          $ref: "#/schemas/FunnelUserCell"
    type: object
