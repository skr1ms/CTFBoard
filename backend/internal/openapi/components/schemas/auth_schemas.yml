schemas:
  jwt.TokenPair:
    properties:
      access_expires_at:
        type: integer
      access_token:
        type: string
    type: object
  request.LoginRequest:
    properties:
      email:
        example: player1@example.com
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,custom_email"
      password:
        example: SecurePassword123!
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required"
    required:
      - email
      - password
    type: object
  request.RegisterRequest:
    properties:
      email:
        example: player1@example.com
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,custom_email"
      password:
        example: SecurePassword123!
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,strong_password"
      username:
        example: player1
        type: string
        x-oapi-codegen-extra-tags:
          validate: "required,custom_username"
      custom_fields:
        description: Custom field values (field_id -> value)
        additionalProperties:
          type: string
        type: object
    required:
      - email
      - username
      - password
    type: object
  response.BanStatus:
    type: object
    properties:
      is_banned:
        type: boolean
      reason:
        type: string
      banned_at:
        type: string
      can_appeal:
        type: boolean
      has_pending_appeal:
        type: boolean
  response.MeResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      role:
        type: string
        description: user role (admin, user)
      team_id:
        type: string
      username:
        type: string
      avatar_url:
        type: string
      has_password:
        type: boolean
        description: true when the account has a local password set (false for OAuth-only accounts)
      ban_status:
        $ref: '#/schemas/response.BanStatus'
    type: object
  response.RegisterResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      username:
        type: string
    type: object

  OAuthExchangeRequest:
    type: object
    required:
      - code
    properties:
      code:
        type: string
        description: One-time exchange code from the OAuth callback query parameter
