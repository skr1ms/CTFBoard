schemas:
  request.AdminUpdateSubmissionRequest:
    properties:
      is_correct:
        type: boolean
    required:
      - is_correct
    type: object
  request.AdminCreateSubmissionRequest:
    properties:
      user_id:
        type: string
        format: uuid
      team_id:
        type: string
        format: uuid
      challenge_id:
        type: string
        format: uuid
      submitted_flag:
        type: string
        maxLength: 200
        x-oapi-codegen-extra-tags:
          validate: "required,max=200"
      is_correct:
        type: boolean
      ip:
        type: string
    required:
      - user_id
      - challenge_id
      - submitted_flag
      - is_correct
    type: object
  response.SubmissionResponse:
    properties:
      id:
        type: string
      user_id:
        type: string
      team_id:
        type: string
      challenge_id:
        type: string
      submitted_flag:
        type: string
      is_correct:
        type: boolean
      ip:
        type: string
      created_at:
        type: string
      username:
        type: string
      team_name:
        type: string
      challenge_title:
        type: string
      challenge_category:
        type: string
    type: object
  response.SubmissionListResponse:
    properties:
      data:
        type: array
        items:
          $ref: "#/schemas/response.SubmissionResponse"
      meta:
        $ref: "#/schemas/response.PaginationMeta"
    type: object
  response.SubmissionStatsResponse:
    properties:
      total:
        type: integer
      correct:
        type: integer
      incorrect:
        type: integer
    type: object
  response.FailListResponse:
    properties:
      data:
        type: array
        items:
          $ref: "#/schemas/response.SubmissionResponse"
      meta:
        $ref: "#/schemas/response.PaginationMeta"
    type: object
