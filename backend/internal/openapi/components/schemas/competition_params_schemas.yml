schemas:
  response.ConfigResponse:
    properties:
      key:
        type: string
      value:
        type: string
      value_type:
        type: string
      category:
        type: string
      description:
        type: string
      updated_at:
        type: string
        format: date-time
    required:
      - key
      - value
      - value_type
    type: object
  response.ConfigCategoryItem:
    type: object
    required:
      - name
      - count
    properties:
      name:
        type: string
      count:
        type: integer
  response.ConfigPublicResponse:
    type: object
    additionalProperties: true
    description: Public config as flat key-value map; values are typed (string, number, boolean).
  request.SetConfigRequest:
    properties:
      value:
        type: string
        maxLength: 10000
      value_type:
        enum:
          - string
          - int
          - bool
          - json
        type: string
        default: string
      description:
        type: string
      category:
        type: string
        description: optional category for non-registry keys
    required:
      - value
    type: object
  request.BatchSetConfigRequest:
    properties:
      configs:
        type: array
        maxItems: 50
        items:
          $ref: '#/schemas/request.BatchSetConfigItem'
    required:
      - configs
    type: object
  request.BatchSetConfigItem:
    properties:
      key:
        type: string
      value:
        type: string
      value_type:
        enum:
          - string
          - int
          - bool
          - json
        type: string
        default: string
      description:
        type: string
      category:
        type: string
        description: optional category for non-registry keys
    required:
      - key
      - value
    type: object
