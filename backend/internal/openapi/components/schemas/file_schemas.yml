schemas:
  response.UploadFileResponse:
    properties:
      id:
        type: string
      filename:
        type: string
      size:
        type: integer
        format: int64
      sha256:
        type: string
    required:
      - id
      - filename
      - size
      - sha256
    type: object
  response.FileDownloadURLResponse:
    properties:
      url:
        type: string
    required:
      - url
    type: object
  response.FileItem:
    properties:
      id:
        type: string
      filename:
        type: string
      size:
        type: integer
      sha256:
        type: string
      created_at:
        type: string
        format: date-time
      url:
        type: string
        description: Presigned download URL (only present when explicitly generated)
    type: object
  entity.File:
    properties:
      id:
        type: string
      type:
        type: string
      challenge_id:
        type: string
      location:
        type: string
      filename:
        type: string
      size:
        type: integer
      sha256:
        type: string
      created_at:
        type: string
    type: object
