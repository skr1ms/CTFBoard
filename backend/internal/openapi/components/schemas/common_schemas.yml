schemas:
  response.PaginationMeta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  v1.ErrorResponse:
    required:
      - code
      - message
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  response.MessageResponse:
    type: object
    required:
      - message
    properties:
      message:
        type: string
