schemas:
  HealthResponse:
    type: object
    description: Health check result; keys are component names (e.g. db, redis, storage), values are "ok" or "error".
    additionalProperties:
      type: string
      enum: [ok, error]
  response.PaginationMeta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  v1.ErrorResponse:
    required:
      - code
      - message
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  v1.ValidationErrorItem:
    required:
      - field
      - message
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  v1.ValidationErrorResponse:
    required:
      - code
      - message
    properties:
      code:
        type: string
        example: VALIDATION_ERROR
      message:
        type: string
      errors:
        type: array
        items:
          $ref: "#/schemas/v1.ValidationErrorItem"
    type: object
  response.MessageResponse:
    type: object
    required:
      - message
    properties:
      message:
        type: string
  response.BulkActionResponse:
    type: object
    required:
      - message
      - affected_count
    properties:
      message:
        type: string
      affected_count:
        type: integer
        minimum: 0
