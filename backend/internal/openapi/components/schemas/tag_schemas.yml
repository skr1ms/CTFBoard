schemas:
  response.TagResponse:
    properties:
      id:
        type: string
      name:
        type: string
      color:
        type: string
    type: object
  request.CreateTagRequest:
    properties:
      name:
        type: string
      color:
        type: string
        default: "#6b7280"
    required:
      - name
    type: object
  request.UpdateTagRequest:
    properties:
      name:
        type: string
      color:
        type: string
    required:
      - name
    type: object
