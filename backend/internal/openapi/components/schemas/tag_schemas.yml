schemas:
  response.TagResponse:
    properties:
      id:
        type: string
      name:
        type: string
      color:
        type: string
    type: object
  request.CreateTagRequest:
    properties:
      name:
        type: string
        maxLength: 50
        x-oapi-codegen-extra-tags:
          validate: "required,max=50"
      color:
        type: string
        default: "#6b7280"
        x-oapi-codegen-extra-tags:
          validate: "omitempty,hex_color"
    required:
      - name
    type: object
  request.UpdateTagRequest:
    properties:
      name:
        type: string
        maxLength: 50
        x-oapi-codegen-extra-tags:
          validate: "required,max=50"
      color:
        type: string
        x-oapi-codegen-extra-tags:
          validate: "omitempty,hex_color"
    required:
      - name
    type: object
