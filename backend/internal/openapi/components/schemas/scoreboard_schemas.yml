schemas:
  ScoreboardHistoryEntry:
    properties:
      points:
        type: integer
      team_id:
        type: string
      team_name:
        type: string
      timestamp:
        type: string
    type: object
  ScorePoint:
    properties:
      timestamp:
        type: string
      score:
        type: integer
    type: object
  TeamTimeline:
    properties:
      team_id:
        type: string
      team_name:
        type: string
      timeline:
        type: array
        items:
          $ref: "#/schemas/ScorePoint"
    type: object
  TimeRange:
    properties:
      start:
        type: string
      end:
        type: string
    type: object
  ScoreboardGraph:
    properties:
      range:
        $ref: "#/schemas/TimeRange"
      teams:
        type: array
        items:
          $ref: "#/schemas/TeamTimeline"
    type: object
  response.ScoreboardEntryResponse:
    properties:
      last_solved:
        type: string
      points:
        type: integer
      team_id:
        type: string
      team_name:
        type: string
    type: object
