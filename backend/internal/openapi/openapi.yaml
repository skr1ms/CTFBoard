openapi: 3.0.0
info:
  contact:
    name: API Support
  description: |
    REST API for managing CTF competition.

    Path parameters use PascalCase (ID, challengeID, teamID, userID, hintID) for consistency with generated code.

    Common error response codes (body is ErrorResponse or ValidationErrorResponse with code and message; for 400 validation errors the body may include an "errors" array of { field, message }):
    - 400 Bad Request: validation error, invalid parameter (e.g. INVALID_FLAG_FORMAT, VALIDATION_ERROR with errors array).
    - 401 Unauthorized: missing or invalid auth (e.g. UNAUTHORIZED, token expired).
    - 403 Forbidden: insufficient rights (e.g. USER_NOT_IN_TEAM, REQUIREMENTS_NOT_MET, team/user banned).
    - 404 Not Found: resource or team not found (e.g. USER_NOT_IN_TEAM when no team for /teams/me/*).
    - 409 Conflict: state conflict (e.g. challenge already solved, username/email taken).
    - 410 Gone: resource no longer available (e.g. invite token expired).
    - 429 Too Many Requests: rate limit exceeded.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: CTF Platform API
  version: 1.0.0
servers:
  - url: /api/v1
    description: CTF Platform API
security:
  - BearerAuth: []
  - ApiTokenAuth: []
paths:
  /health:
    get:
      summary: Health check
      description: |
        Checks DB, Redis, and storage connectivity. Returns 200 if all ok, 503 otherwise.
        Implemented as a custom handler (not via ServerInterface); available at /health and /api/v1/health.
      tags:
        - Infrastructure
      operationId: GetHealth
      security: []
      responses:
        '200':
          description: All systems operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          description: Bad Request
        '503':
          description: One or more systems unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metrics:
    get:
      summary: Prometheus metrics
      description: |
        Exposes Prometheus metrics. Access may be restricted by config.
        Implemented as a custom handler; available at /metrics and /api/v1/metrics.
      tags:
        - Infrastructure
      operationId: GetMetrics
      security: []
      responses:
        '200':
          description: Metrics in Prometheus exposition format
        '400':
          description: Bad Request
  /openapi.json:
    get:
      summary: OpenAPI specification
      description: |
        Returns the OpenAPI 3.0 specification in JSON.
        Implemented as a custom handler; available at /openapi.json and /api/v1/openapi.json.
      tags:
        - Infrastructure
      operationId: GetOpenAPI
      security: []
      responses:
        '200':
          description: OpenAPI 3.0 JSON document
        '400':
          description: Bad Request
  /swagger/index.html:
    get:
      summary: Swagger UI
      description: |
        Interactive API documentation (Swagger UI). Served under /swagger/*.
        Implemented as a custom handler; available at /swagger/* and /api/v1/swagger/*.
      tags:
        - Infrastructure
      operationId: GetSwaggerUI
      security: []
      responses:
        '200':
          description: Swagger UI HTML
        '400':
          description: Bad Request
  /auth/login:
    post:
      operationId: PostAuthLogin
      security: []
      description: Authenticates user and returns JWT tokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        description: Credentials
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: User login
      tags:
        - Authentication
  /auth/register:
    post:
      operationId: PostAuthRegister
      security: []
      description: Creates a new user in the system
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        description: Registration data
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Register new user
      tags:
        - Authentication
  /auth/refresh:
    post:
      operationId: PostAuthRefresh
      security: []
      description: Refreshes access token using the httpOnly refresh cookie set at login
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (e.g. user banned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Refresh tokens
      tags:
        - Authentication
  /auth/me:
    get:
      operationId: GetAuthMe
      description: Returns information about authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
        - ApiTokenAuth: []
      summary: Get current user info
      tags:
        - Authentication
    patch:
      operationId: PatchAuthMe
      description: Updates current user profile (username, email, password)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (username or email taken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
        - ApiTokenAuth: []
      summary: Update current user profile
      tags:
        - Authentication
  /auth/logout:
    post:
      operationId: PostAuthLogout
      description: Invalidates the refresh cookie. Client should discard the access token.
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request (e.g. invalid JSON body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      summary: Logout
      tags:
        - Authentication
  /auth/oauth/{provider}:
    get:
      operationId: GetAuthOauthProvider
      description: Redirects the user to the OAuth provider's authorization page
      parameters:
        - description: OAuth provider name (e.g. github, google)
          in: path
          name: provider
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK (fallback; normally 302 redirect)
        '302':
          description: Redirect to OAuth provider
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      summary: OAuth redirect
      tags:
        - Authentication
  /auth/oauth/{provider}/callback:
    get:
      operationId: GetAuthOauthProviderCallback
      description: Handles the OAuth provider callback, exchanges code for tokens and redirects to the frontend
      parameters:
        - description: OAuth provider name (e.g. github, google)
          in: path
          name: provider
          required: true
          schema:
            type: string
        - description: Authorization code returned by the OAuth provider
          in: query
          name: code
          schema:
            type: string
        - description: State parameter for CSRF protection
          in: query
          name: state
          schema:
            type: string
      responses:
        '200':
          description: OK (fallback; normally 302 redirect)
        '302':
          description: Redirect to frontend with tokens in fragment
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      summary: OAuth callback
      tags:
        - Authentication
  /auth/oauth/exchange:
    post:
      operationId: PostAuthOauthExchange
      security: []
      description: Exchanges a one-time OAuth code (set by the server as a query parameter after a successful OAuth callback) for tokens. The refresh token is returned as an httpOnly cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthExchangeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Bad Request (missing or malformed code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found (code expired or already used)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: OAuth code exchange
      tags:
        - Authentication
  /auth/verify-email:
    post:
      operationId: PostAuthVerifyEmail
      security: []
      description: Verifies user email using token from request body (avoids token in URL/access logs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Gone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Verify email
      tags:
        - Authentication
  /auth/forgot-password:
    post:
      operationId: PostAuthForgotPassword
      security: []
      description: Sends password reset email to specified address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        description: Email address
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Request password reset
      tags:
        - Authentication
  /auth/reset-password:
    post:
      operationId: PostAuthResetPassword
      security: []
      description: Resets password using token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        description: Token and new password
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Gone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Reset password
      tags:
        - Authentication
  /auth/resend-verification:
    post:
      operationId: PostAuthResendVerification
      description: Resends verification email to authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
        - ApiTokenAuth: []
      summary: Resend verification email
      tags:
        - Authentication
  /auth/resend-verification-by-email:
    post:
      operationId: PostAuthResendVerificationByEmail
      security: []
      description: Resends verification email by email address. Always returns success to prevent user enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationByEmailRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Resend verification email by email address
      tags:
        - Authentication
  /admin/users:
    get:
      operationId: GetAdminUsers
      description: Returns list of all users with filtering. Admin only.
      parameters:
        - name: q
          in: query
          description: Search query (username or IP if field=ip)
          schema:
            type: string
        - name: field
          in: query
          description: Search field (username or ip)
          schema:
            type: string
            enum:
              - username
              - ip
            default: username
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
        - ApiTokenAuth: []
      summary: List users (admin)
      tags:
        - Admin
    post:
      operationId: PostAdminUsers
      description: Creates a new user. Admin only.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
        - ApiTokenAuth: []
      summary: Create user (admin)
      tags:
        - Admin
  /admin/users/{ID}:
    patch:
      operationId: PatchAdminUsersID
      description: Updates user data. Admin only.
      parameters:
        - name: ID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
        - ApiTokenAuth: []
      summary: Update user (admin)
      tags:
        - Admin
    delete:
      operationId: DeleteAdminUsersID
      description: Deletes a user. Admin only.
      parameters:
        - name: ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request (e.g. self-delete not allowed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
        - ApiTokenAuth: []
      summary: Delete user (admin)
      tags:
        - Admin
  /users:
    get:
      operationId: GetUsers
      description: Returns paginated list of users (admin or public depending on settings)
      parameters:
        - name: q
          in: query
          description: Search query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
        - ApiTokenAuth: []
      summary: List users
      tags:
        - Users
  /users/{ID}:
    get:
      operationId: GetUsersID
      description: Returns public information about user and their solved challenges. Requires authentication (scoreboard visibility applies).
      parameters:
        - description: User ID
          in: path
          name: ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (scoreboard visibility)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
        - ApiTokenAuth: []
      summary: Get user profile
      tags:
        - Users
  /users/me/solves:
    get:
      operationId: GetUsersMeSolves
      description: Returns solves for current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SolveWithDetailsResponse'
                type: array
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
        - ApiTokenAuth: []
      summary: Get my solves
      tags:
        - Users
  /users/{ID}/solves:
    get:
      operationId: GetUsersIDSolves
      description: Returns solves for a user
      parameters:
        - name: ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SolveWithDetailsResponse'
                type: array
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (not owner and not admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
        - ApiTokenAuth: []
      summary: Get user solves
      tags:
        - Users
  /users/me/fails:
    get:
      operationId: GetUsersMeFails
      description: Returns failed submissions for current user (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
        - ApiTokenAuth: []
      summary: Get my fails
      tags:
        - Users
  /users/{ID}/fails:
    get:
      operationId: GetUsersIDFails
      description: Returns failed submissions for a user (paginated)
      parameters:
        - name: ID
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (not owner and not admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
        - ApiTokenAuth: []
      summary: Get user fails
      tags:
        - Users
  /users/me/awards:
    get:
      operationId: GetUsersMeAwards
      description: Returns awards for current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
