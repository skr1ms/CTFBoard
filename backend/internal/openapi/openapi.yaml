components:
  securitySchemes:
    BearerAuth:
      description: 'JWT access token. Format: "Bearer {token}"'
      in: header
      name: Authorization
      type: apiKey
    ApiTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API Token authentication. Format: Token {plaintext_token}'
  schemas:
    HealthResponse:
      type: object
      description: Health check result; keys are component names (e.g. db, redis, storage), values are "ok" or "error".
      additionalProperties:
        type: string
        enum:
          - ok
          - error
    LoginRequest:
      properties:
        email:
          example: player1@example.com
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,custom_email
        password:
          example: SecurePassword123!
          type: string
          x-oapi-codegen-extra-tags:
            validate: required
      required:
        - email
        - password
      type: object
    TokenPair:
      properties:
        access_expires_at:
          type: integer
        access_token:
          type: string
      type: object
    ErrorResponse:
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
      type: object
    RegisterRequest:
      properties:
        email:
          example: player1@example.com
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,custom_email
        password:
          example: SecurePassword123!
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,strong_password
        username:
          example: player1
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,custom_username
        custom_fields:
          description: Custom field values (field_id -> value)
          additionalProperties:
            type: string
          type: object
      required:
        - email
        - username
        - password
      type: object
    RegisterResponse:
      properties:
        created_at:
          type: string
        email:
          type: string
        id:
          type: string
        username:
          type: string
      type: object
    BanStatus:
      type: object
      properties:
        is_banned:
          type: boolean
        reason:
          type: string
        banned_at:
          type: string
        can_appeal:
          type: boolean
        has_pending_appeal:
          type: boolean
    MeResponse:
      properties:
        created_at:
          type: string
        email:
          type: string
        id:
          type: string
        role:
          type: string
          description: user role (admin, user)
        team_id:
          type: string
        username:
          type: string
        avatar_url:
          type: string
        has_password:
          type: boolean
          description: true when the account has a local password set (false for OAuth-only accounts)
        ban_status:
          $ref: '#/components/schemas/BanStatus'
      type: object
    UpdateProfileRequest:
      properties:
        username:
          type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,custom_username
        email:
          type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,custom_email
        password:
          type: string
          x-oapi-codegen-extra-tags:
            validate: omitempty,strong_password
        current_password:
          type: string
          maxLength: 72
          x-oapi-codegen-extra-tags:
            validate: omitempty,max=72
      type: object
    OAuthExchangeRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: One-time exchange code from the OAuth callback query parameter
    VerifyEmailRequest:
      properties:
        token:
          type: string
          description: Verification token (from email link or copy-paste)
          x-oapi-codegen-extra-tags:
            validate: required
      required:
        - token
      type: object
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ForgotPasswordRequest:
      properties:
        email:
          example: player1@example.com
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,custom_email
      required:
        - email
      type: object
    ResetPasswordRequest:
      properties:
        new_password:
          example: NewSecurePassword123!
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,strong_password
        token:
          type: string
      required:
        - token
        - new_password
      type: object
    ResendVerificationByEmailRequest:
      properties:
        email:
          example: player1@example.com
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,custom_email
      required:
        - email
      type: object
    AdminUserResponse:
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        role:
          type: string
        team_id:
          type: string
        is_verified:
          type: boolean
        is_banned:
          type: boolean
        banned_at:
          type: string
          format: date-time
        banned_reason:
          type: string
        created_at:
          type: string
