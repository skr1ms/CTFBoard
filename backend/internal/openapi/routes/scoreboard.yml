/scoreboard:
  get:
    operationId: GetScoreboard
    description: Returns current scoreboard state sorted by points descending. Optional bracket (category ID) filters by team category. When competition is frozen, returns frozen view unless live=true and requester is admin. Requires authentication (scoreboard visibility applies).
    parameters:
      - name: bracket
        in: query
        description: Filter scoreboard by bracket (category) ID
        required: false
        schema:
          type: string
          format: uuid
      - name: live
        in: query
        description: If true and requester is admin, return live (non-frozen) scoreboard during freeze. Ignored for non-admins.
        required: false
        schema:
          type: boolean
          default: false
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                $ref: '../components/schemas.yml#/ScoreboardEntryResponse'
              type: array
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden (scoreboard hidden or admins-only)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Get scoreboard
    tags:
      - Scoreboard

/scoreboard/graph:
  get:
    operationId: GetScoreboardGraph
    description: Returns scoreboard graph data with team timelines for visualization. When frozen, returns frozen view unless live=true and requester is admin.
    parameters:
      - description: Number of top teams to include
        in: query
        name: top
        schema:
          type: integer
          default: 10
      - name: live
        in: query
        description: If true and requester is admin, return live data during freeze.
        required: false
        schema:
          type: boolean
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ScoreboardGraph'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden (scoreboard hidden or admins-only)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Get scoreboard graph
    tags:
      - Scoreboard
