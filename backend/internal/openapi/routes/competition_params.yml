/admin/configs:
  get:
    description: Returns all dynamic configs. Admin only.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                $ref: '../components/schemas.yml#/ConfigResponse'
              type: array
      "401":
        description: Unauthorized
      "403":
        description: Forbidden
    security:
      - BearerAuth: []
    summary: Get all configs
    tags:
      - Admin

"/admin/configs/{key}":
  get:
    description: Returns config by key. Admin only.
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ConfigResponse'
      "401":
        description: Unauthorized
      "403":
        description: Forbidden
      "404":
        description: Not Found
    security:
      - BearerAuth: []
    summary: Get config by key
    tags:
      - Admin
  put:
    description: Set or update config. Admin only.
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/SetConfigRequest'
      required: true
    responses:
      "200":
        description: OK
      "400":
        description: Bad Request
      "401":
        description: Unauthorized
      "403":
        description: Forbidden
    security:
      - BearerAuth: []
    summary: Set config
    tags:
      - Admin
  delete:
    description: Delete config. Admin only.
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: No Content
      "401":
        description: Unauthorized
      "403":
        description: Forbidden
      "404":
        description: Not Found
    security:
      - BearerAuth: []
    summary: Delete config
    tags:
      - Admin
