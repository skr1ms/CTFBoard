/statistics/submissions/{type}:
  get:
    operationId: GetStatisticsSubmissionsType
    description: Returns submission statistics per day filtered by type (correct or incorrect). When frozen, use live=true (admin) for live data.
    parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum: [correct, incorrect]
        description: Submission type filter
      - name: live
        in: query
        description: If true and requester is admin, return live data during freeze.
        required: false
        schema:
          type: boolean
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                $ref: '../components/schemas.yml#/RegistrationTimePoint'
              type: array
      "400":
        description: Bad Request (invalid type)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Get submission statistics by type
    tags:
      - Statistics

