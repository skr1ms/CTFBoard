/statistics/challenges:
  get:
    description: Returns statistics for all challenges including solve counts
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                $ref: '../components/schemas.yml#/ChallengeStats'
              type: array
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Get challenge statistics
    tags:
      - Statistics

/statistics/challenges/{ID}:
  get:
    description: Returns detailed statistics for a single challenge (solves, first blood, percentage)
    parameters:
      - name: ID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ChallengeDetailStats'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Challenge not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Get challenge detail statistics
    tags:
      - Statistics

/statistics/general:
  get:
    description: Returns general platform statistics (counts of users, teams, challenges, solves)
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/GeneralStats'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Get general statistics
    tags:
      - Statistics

/statistics/scoreboard:
  get:
    description: Returns scoreboard history for graph visualization. Default limit 10 (max 50)
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        description: Number of teams to include in history (default 10, max 50)
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                $ref: '../components/schemas.yml#/ScoreboardHistoryEntry'
              type: array
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Get scoreboard history
    tags:
      - Statistics

