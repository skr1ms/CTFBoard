/statistics/challenges:
  get:
    operationId: GetStatisticsChallenges
    description: Returns statistics for all challenges including solve counts. When frozen, use live=true (admin) for live data.
    parameters:
      - name: live
        in: query
        description: If true and requester is admin, return live data during freeze.
        required: false
        schema:
          type: boolean
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                $ref: '../components/schemas.yml#/ChallengeStats'
              type: array
      "400":
        description: Bad Request
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Get challenge statistics
    tags:
      - Statistics

/statistics/challenges/{ID}:
  get:
    operationId: GetStatisticsChallengesID
    description: Returns detailed statistics for a single challenge (solves, first blood, percentage). When frozen, use live=true (admin) for live data.
    parameters:
      - name: ID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: live
        in: query
        description: If true and requester is admin, return live data during freeze.
        required: false
        schema:
          type: boolean
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ChallengeDetailStats'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Challenge not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Get challenge detail statistics
    tags:
      - Statistics

