/statistics/submissions:
  get:
    description: Returns aggregated submission statistics per day
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/SubmissionTimeSeriesResponse'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Get submission statistics
    tags:
      - Statistics

/statistics/submissions/{type}:
  get:
    description: Returns submission statistics per day filtered by type (correct or incorrect)
    parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum: [correct, incorrect]
        description: Submission type filter
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                $ref: '../components/schemas.yml#/RegistrationTimePoint'
              type: array
      "400":
        description: Bad Request (invalid type)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Get submission statistics by type
    tags:
      - Statistics

