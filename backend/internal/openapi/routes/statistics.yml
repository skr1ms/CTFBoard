/statistics/scoreboard:
  get:
    operationId: GetStatisticsScoreboard
    description: Returns scoreboard history for graph visualization. Default limit 10 (max 50). When frozen, use live=true (admin) for live data.
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        description: Number of teams to include in history (default 10, max 50)
      - name: live
        in: query
        description: If true and requester is admin, return live data during freeze.
        required: false
        schema:
          type: boolean
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                $ref: '../components/schemas.yml#/ScoreboardHistoryEntry'
              type: array
      "400":
        description: Bad Request
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Get scoreboard history
    tags:
      - Statistics

