/shares:
  post:
    operationId: PostShares
    summary: Create a solve share link
    description: Creates a signed public link for a challenge already solved by the authenticated user's team.
    tags:
      - Shares
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/CreateShareRequest'
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ShareResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []

/shares/solve:
  get:
    operationId: GetSharesSolve
    summary: Resolve a solve share link
    description: Returns a public HTML preview for a signed solve share link.
    tags:
      - Shares
    parameters:
      - name: solve_id
        in: query
        required: true
        description: Solve ID from the share link
        schema:
          type: string
          format: uuid
      - name: mac
        in: query
        required: true
        description: Hex-encoded HMAC-SHA256 signature
        schema:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
    responses:
      "200":
        description: OK
        content:
          text/html:
            schema:
              type: string
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security: []
