/comments/{ID}:
  delete:
    operationId: DeleteCommentsID
    description: Deletes own comment by ID.
    parameters:
      - description: Comment ID
        in: path
        name: ID
        required: true
        schema:
          type: string
    responses:
      "204":
        description: No Content
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden (not comment owner)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Delete comment
    tags:
      - Comments
