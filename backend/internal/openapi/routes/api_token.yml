/user/tokens:
  get:
    operationId: GetUserTokens
    description: Returns list of API tokens for current user
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas.yml#/APITokenResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden (Bearer token and verified email required)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: List my API tokens
    tags:
      - User
  post:
    operationId: PostUserTokens
    description: Creates a new API token. Returns plaintext token once.
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/CreateAPITokenRequest'
      required: true
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/APITokenCreatedResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden (Bearer token and verified email required)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Create API token
    tags:
      - User

"/user/tokens/{ID}":
  delete:
    operationId: DeleteUserTokensID
    description: Revokes an API token
    parameters:
      - name: ID
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: No Content
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden (Bearer token and verified email required)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Revoke API token
    tags:
      - User
