/user/tokens:
  get:
    description: Returns list of API tokens for current user
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas.yml#/APITokenResponse'
      "401":
        description: Unauthorized
    security:
      - BearerAuth: []
    summary: List my API tokens
    tags:
      - User
  post:
    description: Creates a new API token. Returns plaintext token once.
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/CreateAPITokenRequest'
      required: true
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/APITokenCreatedResponse'
      "400":
        description: Bad Request
      "401":
        description: Unauthorized
    security:
      - BearerAuth: []
    summary: Create API token
    tags:
      - User

"/user/tokens/{ID}":
  delete:
    description: Revokes an API token
    parameters:
      - name: ID
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: No Content
      "401":
        description: Unauthorized
      "404":
        description: Not Found
    security:
      - BearerAuth: []
    summary: Revoke API token
    tags:
      - User
