"/users/me/avatar":
  put:
    operationId: PutUsersMeAvatar
    description: Upload or update current user's avatar
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: Avatar image file (JPEG, PNG, WebP, GIF; max 5MB; min 100x100, max 5000x5000)
    responses:
      "200":
        description: Avatar uploaded successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/AvatarUploadResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden (email not verified)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "413":
        description: Payload Too Large
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Upload user avatar
    tags:
      - Users
  delete:
    operationId: DeleteUsersMeAvatar
    description: Delete current user's avatar
    responses:
      "204":
        description: Avatar deleted successfully
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Delete user avatar
    tags:
      - Users

