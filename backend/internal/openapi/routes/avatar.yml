"/avatars/{path}":
  get:
    operationId: GetAvatarByPath
    description: Serves avatar files (full-size or thumbnail) by storage path. Public endpoint with rate limiting.
    parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: Storage path to the avatar file
    responses:
      "200":
        description: Avatar image file
        content:
          image/webp:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      "404":
        description: Avatar not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security: []
    summary: Get avatar by path
    tags:
      - Avatars
