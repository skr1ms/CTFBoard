      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Update submission
    tags:
      - Admin
  delete:
    operationId: DeleteAdminSubmissionsID
    description: Deletes a submission. Admin only.
