"/auth/oauth/providers":
  get:
    operationId: GetAuthOauthProviders
    security: []
    description: Returns which OAuth providers are configured and currently enabled.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/OAuthProvidersResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    summary: OAuth providers
    tags:
      - Authentication

"/auth/oauth/exchange":
  post:
    operationId: PostAuthOauthExchange
    security: []
    description: Exchanges a one-time OAuth code (set by the server as a query parameter after a successful OAuth callback) for tokens. The refresh token is returned as an httpOnly cookie.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/OAuthExchangeRequest'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/TokenPair'
      "400":
        description: Bad Request (missing or malformed code)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found (code expired or already used)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    summary: OAuth code exchange
    tags:
      - Authentication

"/auth/oauth/{provider}":
  get:
    operationId: GetAuthOauthProvider
    description: Redirects the user to the OAuth provider's authorization page
    parameters:
      - description: OAuth provider name (e.g. github, google)
        in: path
        name: provider
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK (fallback; normally 302 redirect)
      "302":
        description: Redirect to OAuth provider
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security: []
    summary: OAuth redirect
    tags:
      - Authentication

"/auth/oauth/{provider}/callback":
  get:
    operationId: GetAuthOauthProviderCallback
    description: Handles the OAuth provider callback, exchanges code for tokens and redirects to the frontend
    parameters:
      - description: OAuth provider name (e.g. github, google)
        in: path
        name: provider
        required: true
        schema:
          type: string
      - description: Authorization code returned by the OAuth provider
        in: query
        name: code
        schema:
          type: string
      - description: State parameter for CSRF protection
        in: query
        name: state
        schema:
          type: string
    responses:
      "200":
        description: OK (fallback; normally 302 redirect)
      "302":
        description: Redirect to frontend with a one-time OAuth exchange code in the query string
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "409":
        description: Conflict
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security: []
    summary: OAuth callback
    tags:
      - Authentication
