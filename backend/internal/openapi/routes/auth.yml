/auth/login:
  post:
    operationId: PostAuthLogin
    security: []
    description: Authenticates user and returns JWT tokens
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/LoginRequest'
      description: Credentials
      required: true
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/TokenPair'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    summary: User login
    tags:
      - Authentication

/auth/register:
  post:
    operationId: PostAuthRegister
    security: []
    description: Creates a new user in the system
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/RegisterRequest'
      description: Registration data
      required: true
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/RegisterResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "409":
        description: Conflict
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    summary: Register new user
    tags:
      - Authentication

/auth/refresh:
  post:
    operationId: PostAuthRefresh
    security: []
    description: Refreshes access token using the httpOnly refresh cookie set at login
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/TokenPair'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden (e.g. user banned)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    summary: Refresh tokens
    tags:
      - Authentication

/auth/me:
  get:
    operationId: GetAuthMe
    description: Returns information about authenticated user
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/MeResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Get current user info
    tags:
      - Authentication
  patch:
    operationId: PatchAuthMe
    description: Updates current user profile (username, email, password, editable custom fields)
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/UpdateProfileRequest'
      required: true
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/MeResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "409":
        description: Conflict (username or email taken)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Update current user profile
    tags:
      - Authentication

/auth/logout:
  post:
    operationId: PostAuthLogout
    description: Invalidates the refresh cookie. Client should discard the access token.
    responses:
      "204":
        description: No Content
      "400":
        description: Bad Request (e.g. invalid JSON body)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security: []
    summary: Logout
    tags:
      - Authentication
