      "401":
        description: Unauthorized
      "403":
        description: Forbidden
    security:
      - BearerAuth: []
    summary: Create hint
    tags:
      - Admin

"/admin/hints/{ID}":
  put:
    description: Updates hint data. Admin only.
    parameters:
      - name: ID
        in: path
