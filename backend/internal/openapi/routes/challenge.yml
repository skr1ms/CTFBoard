"/challenges/{challengeID}/requirements":
  get:
    description: Returns list of challenge requirements (prerequisites)
    parameters:
      - description: Challenge ID
        in: path
        name: challengeID
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                $ref: '../components/schemas.yml#/ChallengeRequirementResponse'
              type: array
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
