/challenges/types:
  get:
    description: Returns list of available challenge types
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                type: string
              type: array
    security: []
    summary: Get challenge types
    tags:
      - Challenges

/admin/challenges:
  post:
    description: Creates new challenge. Admin only
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/CreateChallengeRequest'
      required: true
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ChallengeResponse'
      "400":
        description: Bad Request
      "401":
        description: Unauthorized
      "403":
        description: Forbidden
    security:
      - BearerAuth: []
    summary: Create challenge
    tags:
      - Admin

"/admin/challenges/{ID}":
  put:
    description: Updates challenge data. Admin only
    parameters:
      - name: ID
        in: path
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/UpdateChallengeRequest'
      required: true
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ChallengeResponse'
      "400":
        description: Bad Request
      "401":
        description: Unauthorized
      "403":
        description: Forbidden
      "404":
        description: Not Found
    security:
      - BearerAuth: []
    summary: Update challenge
    tags:
      - Admin
  delete:
    description: Deletes challenge. Admin only
    parameters:
      - name: ID
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: No Content
      "401":
        description: Unauthorized
      "403":
        description: Forbidden
      "404":
        description: Not Found
    security:
      - BearerAuth: []
    summary: Delete challenge
    tags:
      - Admin

"/admin/challenges/{challengeID}/files":
  post:
    description: Uploads file attachment to a challenge. Admin only
    parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
    requestBody:
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
                description: File to upload
              type:
                type: string
                enum: [challenge, writeup]
                description: File type (defaults to challenge)
            required:
              - file
      required: true
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/UploadFileResponse'
      "400":
        description: Bad Request
      "401":
        description: Unauthorized
      "403":
        description: Forbidden
    security:
      - BearerAuth: []
    summary: Upload file to challenge
    tags:
      - Admin

"/admin/unlocks":
  get:
    description: Returns paginated list of all hint unlocks. Admin only.
    parameters:
      - name: page
        in: query
        schema:
          type: integer
      - name: per_page
        in: query
        schema:
          type: integer
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/HintUnlockListResponse'
      "401":
        description: Unauthorized
      "403":
        description: Forbidden
    security:
      - BearerAuth: []
    summary: Get all hint unlocks
    tags:
      - Admin

"/admin/challenges/{challengeID}/solution":
  post:
    description: Creates or updates challenge solution/writeup content. Admin only.
    parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/AdminUpsertSolutionRequest'
      required: true
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ChallengeSolutionResponse'
      "400":
        description: Bad Request
      "401":
        description: Unauthorized
      "403":
        description: Forbidden
      "404":
        description: Not Found
    security:
      - BearerAuth: []
    summary: Upsert challenge solution
    tags:
      - Admin
  delete:
    description: Deletes challenge solution/writeup. Admin only.
    parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: No Content
      "401":
        description: Unauthorized
      "403":
        description: Forbidden
    security:
      - BearerAuth: []
    summary: Delete challenge solution
    tags:
      - Admin

"/admin/challenges/{challengeID}/hints":
  post:
    description: Creates a new hint for a challenge. Admin only.
    parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
