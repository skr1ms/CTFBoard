    description: Uploads file attachment to a challenge. Admin only.
    parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
    requestBody:
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
