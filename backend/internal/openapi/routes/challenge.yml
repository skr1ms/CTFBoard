      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/HintAdminResponse'
      "400":
        description: Bad Request
      "401":
        description: Unauthorized
      "403":
        description: Forbidden
      "404":
        description: Not Found
    security:
      - BearerAuth: []
    summary: Update hint
    tags:
      - Admin
  delete:
    description: Deletes hint. Admin only.
    parameters:
      - name: ID
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: No Content
      "401":
        description: Unauthorized
      "403":
        description: Forbidden
      "404":
        description: Not Found
    security:
      - BearerAuth: []
    summary: Delete hint
