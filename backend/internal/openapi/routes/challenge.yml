/challenges:
  get:
    operationId: GetChallenges
    description: Returns list of all challenges with solved status for the authenticated user's team. Requires authentication; challenge_visibility gates authenticated non-admin users.
    parameters:
      - name: tag
        in: query
        description: Filter challenges by tag ID
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                $ref: '../components/schemas.yml#/ChallengeResponse'
              type: array
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden (challenge visibility or team banned)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Get challenges list
    tags:
      - Challenges

/challenges/{challengeID}:
  get:
    operationId: GetChallengesChallengeID
    description: Returns a single challenge with details for the authenticated user (files, hints, first blood). Requires authentication; challenge_visibility gates authenticated non-admin users.
    parameters:
      - description: Challenge ID
        in: path
        name: challengeID
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ChallengeDetailResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Get challenge by ID
    tags:
      - Challenges

/challenges/{challengeID}/solves:
  get:
    operationId: GetChallengesChallengeIDSolves
    description: Returns list of solves for a challenge
    parameters:
      - description: Challenge ID
        in: path
        name: challengeID
        required: true
        schema:
          type: string
    responses:
