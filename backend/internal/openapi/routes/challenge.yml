/challenges:
  get:
    description: Returns list of all challenges with solved status for user's team
    parameters:
      - name: tag
        in: query
        description: Filter challenges by tag ID
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                $ref: '../components/schemas.yml#/ChallengeResponse'
              type: array
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Get challenges list
    tags:
      - Challenges

/challenges/{challengeID}:
  get:
    description: Returns single challenge with details (files, hints, first blood)
    parameters:
      - description: Challenge ID
        in: path
        name: challengeID
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ChallengeDetailResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Get challenge by ID
    tags:
      - Challenges

/challenges/{challengeID}/solves:
  get:
    description: Returns list of solves for a challenge
    parameters:
      - description: Challenge ID
        in: path
        name: challengeID
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                $ref: '../components/schemas.yml#/ChallengeSolveEntry'
              type: array
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Get challenge solves
    tags:
      - Challenges

/challenges/{ID}/submit:
  post:
    description: "Verifies flag for challenge. Rate limit: 5 attempts per minute"
    parameters:
      - description: Challenge ID
        in: path
        name: ID
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/SubmitFlagRequest'
      description: Flag to verify
      required: true
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/SubmitFlagResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "409":
        description: Conflict
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Submit flag
    tags:
      - Challenges

/challenges/{ID}/first-blood:
  get:
    description: Returns the first solver of a challenge
    parameters:
      - description: Challenge ID
        in: path
        name: ID
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/FirstBloodResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    summary: Get first blood
    tags:
      - Challenges

/challenges/{challengeID}/files:
  get:
    description: Returns list of files attached to a challenge
    parameters:
      - description: Challenge ID
        in: path
        name: challengeID
        required: true
        schema:
          type: string
      - description: "File type: challenge or writeup"
        in: query
        name: type
        schema:
          type: string
          default: challenge
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                $ref: '../components/schemas.yml#/FileItem'
              type: array
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Get challenge files
    tags:
      - Challenges

/challenges/{challengeID}/hints:
  get:
    description: Returns list of hints for a challenge. Content is hidden for non-unlocked hints.
    parameters:
      - description: Challenge ID
        in: path
        name: challengeID
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                $ref: '../components/schemas.yml#/HintResponse'
              type: array
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Get hints for challenge
    tags:
      - Hints

/challenges/{challengeID}/hints/{hintID}/unlock:
  post:
    description: Unlocks a hint by spending team points
    parameters:
      - description: Challenge ID
        in: path
        name: challengeID
        required: true
        schema:
          type: string
      - description: Hint ID
        in: path
        name: hintID
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/HintResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "402":
        description: Insufficient points
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "409":
        description: Already unlocked
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Unlock hint
    tags:
      - Hints

/challenges/{challengeID}/comments:
  get:
    description: Returns comments for a challenge. Available only after competition has ended.
    parameters:
      - description: Challenge ID
        in: path
        name: challengeID
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                $ref: '../components/schemas.yml#/CommentResponse'
              type: array
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden (competition not ended)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Get comments for challenge
    tags:
      - Comments
  post:
    description: Creates a comment for a challenge. Available only after competition has ended.
    parameters:
      - description: Challenge ID
        in: path
        name: challengeID
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/CreateCommentRequest'
      required: true
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/CommentResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden (competition not ended)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Create comment for challenge
    tags:
      - Comments

"/challenges/{challengeID}/tags":
  get:
    description: Returns list of tags for a challenge
    parameters:
      - description: Challenge ID
        in: path
        name: challengeID
