/challenges/{challengeID}/submit:
  post:
    operationId: PostChallengesChallengeIDSubmit
    description: |
      Verifies the submitted flag against the challenge's single answer definition.
      The answer is either a fixed flag hash or an encrypted regex flag. The v1
      answer model has no multi-flag groups or partial submission state: a
      submission is correct or incorrect, while ratelimited/discarded attempts
      remain audit/status records. Rate limit: 5 attempts per minute.
    parameters:
      - description: Challenge ID
        in: path
        name: challengeID
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/SubmitFlagRequest'
      description: Flag to verify
      required: true
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/SubmitFlagResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "409":
        description: Conflict (e.g. challenge already solved by team)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Submit flag
    tags:
      - Challenges

/challenges/{challengeID}/first-blood:
  get:
    operationId: GetChallengesChallengeIDFirstBlood
    description: Returns the first solver of a challenge. When competition is frozen, returns frozen view unless live=true and requester is admin.
    parameters:
      - description: Challenge ID
        in: path
        name: challengeID
        required: true
        schema:
          type: string
      - name: live
        in: query
        description: If true and requester is admin, return live (non-frozen) first blood during freeze.
        required: false
        schema:
          type: boolean
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/FirstBloodResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden (scoreboard visibility or team banned)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Get first blood
    tags:
      - Challenges

