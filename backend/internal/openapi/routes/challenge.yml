"/admin/challenges/{challengeID}/requirements":
  put:
    description: Sets prerequisite challenges that must be solved before this challenge. Admin only.
    parameters:
      - description: Challenge ID
        in: path
        name: challengeID
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/SetChallengeRequirementsRequest'
      required: true
    responses:
      "204":
        description: No Content
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Set challenge requirements
    tags:
      - Admin

"/challenges/solutions":
  get:
    description: Returns all solutions for challenges solved by the requesting user's team. Requires writeup_enabled=true.
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas.yml#/ChallengeSolutionEntry'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden - writeups disabled
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: List all solutions for solved challenges
    tags:
      - Challenges

"/challenges/{challengeID}/solution":
  get:
    description: Returns challenge solution/writeup if available and user has solved the challenge
    parameters:
      - description: Challenge ID
        in: path
        name: challengeID
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ChallengeSolutionResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden - challenge not solved
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Get challenge solution
    tags:
      - Challenges

"/admin/challenges/{challengeID}/flags":
  get:
    description: Returns flags for a challenge. Admin only.
    parameters:
      - description: Challenge ID
        in: path
        name: challengeID
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ChallengeFlagsResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
