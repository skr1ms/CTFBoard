/admin/storage:
  get:
    operationId: GetAdminStorage
    summary: List storage objects
    description: List storage objects under a required prefix. Admin only.
    parameters:
      - name: prefix
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
      - name: cursor
        in: query
        required: false
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/StorageListResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    tags:
      - Admin
  delete:
    operationId: DeleteAdminStorage
    summary: Delete a storage object
    description: Permanently delete a file from storage. Creates an audit log entry. Admin only.
    parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
    responses:
      "204":
        description: Deleted
      "400":
        description: Bad Request (invalid path)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    tags:
      - Admin
