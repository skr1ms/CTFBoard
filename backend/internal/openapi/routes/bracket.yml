/brackets:
  get:
    operationId: GetBrackets
    security: []
    description: Returns list of all brackets (team categories)
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              items:
                $ref: '../components/schemas.yml#/BracketResponse'
              type: array
      "400":
        description: Bad Request
    summary: Get brackets list
    tags:
      - Brackets

/admin/brackets:
  post:
    operationId: PostAdminBrackets
    description: Creates a new bracket. Admin only.
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/CreateBracketRequest'
      required: true
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/BracketResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "409":
        description: Conflict
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Create bracket
    tags:
      - Admin

"/admin/brackets/{ID}":
  get:
    operationId: GetAdminBracketsID
    description: Returns bracket by ID. Admin only.
    parameters:
      - name: ID
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/BracketResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Get bracket by ID
    tags:
      - Admin
  put:
    operationId: PutAdminBracketsID
    description: Updates a bracket. Admin only.
    parameters:
      - name: ID
        in: path
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/UpdateBracketRequest'
      required: true
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/BracketResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "409":
        description: Conflict
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Update bracket
    tags:
      - Admin
  delete:
    operationId: DeleteAdminBracketsID
    description: Deletes a bracket. Admin only.
    parameters:
      - name: ID
        in: path
        required: true
        schema:
          type: string
    responses:
      "204":
        description: No Content
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Delete bracket
    tags:
      - Admin
