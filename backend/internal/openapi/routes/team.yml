/teams/me:
  patch:
    description: Updates current user's team. Captain only.
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/UpdateTeamRequest'
      required: true
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/TeamResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
      "403":
        description: Forbidden (not captain)
      "409":
        description: Conflict (name taken)
    security:
      - BearerAuth: []
    summary: Update my team
    tags:
      - Teams
  delete:
    description: Disbands the current team (Captain only)
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/MessageResponse'
      "401":
