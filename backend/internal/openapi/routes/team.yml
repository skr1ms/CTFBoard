/teams:
  get:
    description: Returns paginated list of teams
    parameters:
      - name: q
        in: query
        description: Search query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          default: 50
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/TeamListResponse'
      "401":
        description: Unauthorized
    security:
      - BearerAuth: []
    summary: List teams
    tags:
      - Teams
  post:
    description: Creates new team. User becomes captain. Returns 200 with ConfirmationRequired if the operation would affect existing data and confirmation is needed; returns 201 with TeamResponse on success.
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/CreateTeamRequest'
      description: Team data
      required: true
    responses:
      "200":
        description: Confirmation required before proceeding
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ConfirmationRequired'
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/TeamResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "409":
        description: Conflict
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
    summary: Create team
    tags:
      - Teams

