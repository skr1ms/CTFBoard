/auth/verify-email:
  post:
    operationId: PostAuthVerifyEmail
    security: []
    description: Verifies user email using token from request body (avoids token in URL/access logs)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/VerifyEmailRequest'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/MessageResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found (token not found)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "410":
        description: Gone
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    summary: Verify email
    tags:
      - Authentication

/auth/forgot-password:
  post:
    operationId: PostAuthForgotPassword
    security: []
    description: Sends password reset email to specified address
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/ForgotPasswordRequest'
      description: Email address
      required: true
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/MessageResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    summary: Request password reset
    tags:
      - Authentication

/auth/reset-password:
  post:
    operationId: PostAuthResetPassword
    security: []
    description: Resets password using token
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/ResetPasswordRequest'
      description: Token and new password
      required: true
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/MessageResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "404":
        description: Not Found (token not found)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "410":
        description: Gone
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    summary: Reset password
    tags:
      - Authentication

/auth/resend-verification-by-email:
  post:
    operationId: PostAuthResendVerificationByEmail
    security: []
    description: Resends verification email by email address. Always returns success to prevent user enumeration.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/ResendVerificationByEmailRequest'
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/MessageResponse'
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    summary: Resend verification email by email address
    tags:
      - Authentication

/auth/resend-verification:
  post:
    operationId: PostAuthResendVerification
    description: Resends verification email to authenticated user
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/MessageResponse'
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
      "429":
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/ErrorResponse'
    security:
      - BearerAuth: []
      - ApiTokenAuth: []
    summary: Resend verification email
    tags:
      - Authentication
