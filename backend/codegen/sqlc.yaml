version: "2"
sql:
  - engine: "postgresql"
    queries: "../queries"
    schema: "../migrations"
    gen:
      go:
        package: "sqlc"
        out: "../internal/repo/persistent/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        rename:
          id: ID
          # "solves" singularizes to "solf" via jinzhu/inflection (bug) -- this rename is required
          solf: Solve
          # table-level renames: match Go acronym conventions
          api_token: APIToken
          oauth_account: OAuthAccount
          app_setting: AppSettings
          tracking: TrackingEntry
          config: CompetitionParam
          # field-level renames: acronym conventions (IP, URL, OAuth, CSV, TTL)
          ip: IP
          sha256: SHA256
          frontend_url: FrontendURL
          cors_origins: CORSOrigins
          verify_ttl_hours: VerifyTTLHours
          reset_ttl_hours: ResetTTLHours
          csv_export_max_rows: CSVExportMaxRows
          rate_limit_general_ip_per_minute: RateLimitGeneralIPPerMinute
          rate_limit_oauth_callback_per_minute: RateLimitOAuthCallbackPerMinute
          oauth_github_enabled: OAuthGithubEnabled
          oauth_google_enabled: OAuthGoogleEnabled
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "pg_catalog.uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "pg_catalog.timestamp"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true