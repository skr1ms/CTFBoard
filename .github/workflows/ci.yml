name: CI
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 0"  # Every Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      load_test_short:
        description: "Run load tests in short mode (skip soak)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: preflight
  gitleaks:
    name: runner / gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  yamllint:
    name: runner / yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: reviewdog/action-yamllint@v1
        with:
          fail_level: error
          reporter: github-pr-review
          yamllint_flags: '-d "{extends: default, rules: {truthy: disable}}" .'

  hadolint:
    name: runner / hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: reviewdog/action-hadolint@v1
        with:
          fail_level: error
          reporter: github-pr-review
          hadolint_flags: "backend/Dockerfile frontend/board/Dockerfile frontend/seaweedfs-ui/Dockerfile deployment/haproxy/Dockerfile deployment/certbot/Dockerfile deployment/docker/loki.Dockerfile"

  dotenv-linter:
    name: runner / dotenv-linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dotenv-linter/action-dotenv-linter@v2
        with:
          reporter: github-pr-review

  # Stage 2: checks
  check-dependencies:
    name: runner / check-dependencies
    runs-on: ubuntu-latest
    needs: [gitleaks, yamllint, hadolint, dotenv-linter]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make deps-audit

  check-dependencies-full:
    name: runner / check-dependencies-full
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: [gitleaks, yamllint, hadolint, dotenv-linter]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: govulncheck all packages
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make deps-audit-all

  golangci-lint:
    name: runner / golangci-lint
    runs-on: ubuntu-latest
    needs: [gitleaks, yamllint, hadolint, dotenv-linter]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Lint
        working-directory: backend
        run: |
          go mod download
          make install-tools
          make lint LINT_TIMEOUT=15m

  codegen-verify:
    name: runner / codegen-verify
    runs-on: ubuntu-latest
    needs: [gitleaks, yamllint, hadolint, dotenv-linter]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Install tools and generate
        working-directory: backend
        run: |
          go mod download
          make install-tools
          make generate
      - name: Verify codegen is up to date
        run: git diff --exit-code

  backend-build:
    name: runner / backend-build
    runs-on: ubuntu-latest
    needs: [gitleaks, yamllint, hadolint, dotenv-linter]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Build backend
        working-directory: backend
        run: |
          go mod download
          make build
      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend/bin/backend
          retention-days: 7

  frontend-lint:
    name: runner / frontend-lint
    runs-on: ubuntu-latest
    needs: [gitleaks, yamllint, hadolint, dotenv-linter]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: frontend/board
        run: bun install --frozen-lockfile
      - name: Type-check
        working-directory: frontend/board
        run: bun run type-check
      - name: Lint
        working-directory: frontend/board
        run: bun run lint

  # Stage 3: tests
  test:
    name: runner / tests
    runs-on: ubuntu-latest
    needs: [check-dependencies, golangci-lint, codegen-verify, backend-build]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Tests
        working-directory: backend
        run: |
          go mod download
          make test-race

  frontend-test:
    name: runner / frontend-test
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: frontend/board
        run: bun install --frozen-lockfile
      - name: Test
        working-directory: frontend/board
        run: bun run test

  # Stage 4: package
  backend-build-cleanup:
    name: runner / backend-build-cleanup
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Build cleanup tool
        working-directory: backend
        run: |
          go mod download
          make build-cleanup
      - name: Upload cleanup binary
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-binary
          path: backend/bin/ctf-platform-cleanup
          retention-days: 7

  backend-docker-build:
    name: runner / backend-docker-build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ctf-platform-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-docker-build:
    name: runner / frontend-docker-build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend/board
          file: ./frontend/board/Dockerfile
          push: false
          tags: ctf-platform-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=http://localhost:8090/api/v1
            VITE_WS_URL=ws://localhost:8090/api/v1/ws
            VITE_SSE_URL=http://localhost:8090/api/v1/sse
            VITE_APP_NAME=CTF Platform
          cache-from: type=gha
          cache-to: type=gha,mode=max

  load-test:
    name: runner / load-tests
    # Only run on manual dispatch or scheduled trigger, never on regular push/PR.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Run load tests
        working-directory: backend
        env:
          LOAD_TEST_SHORT: ${{ github.event.inputs.load_test_short || 'true' }}
        run: |
          go mod download
          mkdir -p load-test/reports
          if [ "$LOAD_TEST_SHORT" = "true" ]; then
            make test-load-report
          else
            make test-load-report-full
          fi
      - name: Upload load test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports-${{ github.run_id }}
          path: backend/load-test/reports/
          retention-days: 30
