name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 3 * * 0"  # Every Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      load_test_short:
        description: "Run load tests in short mode (skip soak)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  golangci-lint:
    name: runner / golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Lint
        working-directory: backend
        run: |
          go mod download
          make install-tools
          make lint LINT_TIMEOUT=15m

  yamllint:
    name: runner / yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-yamllint@v1
        with:
          fail_on_error: true
          reporter: github-pr-review
          yamllint_flags: '-d "{extends: default, rules: {truthy: disable}}" .'

  hadolint:
    name: runner / hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-hadolint@v1
        with:
          fail_on_error: true
          reporter: github-pr-review
          hadolint_flags: "backend/Dockerfile"

  dotenv-linter:
    name: runner / dotenv-linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dotenv-linter/action-dotenv-linter@v2
        with:
          reporter: github-pr-review

  check-dependencies:
    name: runner / check-dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: WriteGoList
        working-directory: backend
        run: go list -json -m all > go.list
      - name: Nancy
        uses: sonatype-nexus-community/nancy-github-action@main

  test:
    name: runner / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Tests
        working-directory: backend
        run: |
          go mod download
          make test-race

  codegen-verify:
    name: runner / codegen-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install tools and generate
        working-directory: backend
        run: |
          go mod download
          make install-tools
          make generate
      - name: Verify codegen is up to date
        run: git diff --exit-code

  backend-build:
    name: runner / backend-build
    runs-on: ubuntu-latest
    needs: [golangci-lint, test, codegen-verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build backend
        working-directory: backend
        run: |
          go mod download
          make build
      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend/bin/backend
          retention-days: 7

  backend-build-cleanup:
    name: runner / backend-build-cleanup
    runs-on: ubuntu-latest
    needs: [golangci-lint, test, codegen-verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build cleanup tool
        working-directory: backend
        run: |
          go mod download
          make build-cleanup
      - name: Upload cleanup binary
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-binary
          path: backend/bin/astroctfb-cleanup
          retention-days: 7

  backend-docker-build:
    name: runner / backend-docker-build
    runs-on: ubuntu-latest
    needs: [golangci-lint, test, codegen-verify]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: astroctfb-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  load-test:
    name: runner / load-tests
    # Only run on manual dispatch or scheduled trigger, never on regular push/PR.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run load tests
        working-directory: backend
        env:
          LOAD_TEST_SHORT: ${{ github.event.inputs.load_test_short || 'true' }}
        run: |
          go mod download
          mkdir -p load-test/reports
          if [ "$LOAD_TEST_SHORT" = "true" ]; then
            make test-load-report
          else
            make test-load-report-full
          fi
      - name: Upload load test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports-${{ github.run_id }}
          path: backend/load-test/reports/
          retention-days: 30
