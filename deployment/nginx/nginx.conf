# ==========================================
# Proxy Cache Zone
# ==========================================
proxy_cache_path /var/cache/nginx/api
    levels=1:2
    keys_zone=api_cache:10m
    max_size=100m
    inactive=30m
    use_temp_path=off;

# ==========================================  
# 1. GitLab (gitlab.ctfleague.ru)
# ==========================================
server {
    server_name gitlab.ctfleague.ru;

    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_set_header Host $host;    
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; 
    ssl_certificate /etc/letsencrypt/live/ctfleague.ru/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/ctfleague.ru/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 
}

# ==========================================   
# 2. Docker Registry (registry.ctfleague.ru)   
# ==========================================   
server {                                       
    server_name registry.ctfleague.ru;         
    client_max_body_size 2048M;                

    location / {
        proxy_pass http://127.0.0.1:5001;    
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; 
    ssl_certificate /etc/letsencrypt/live/ctfleague.ru/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/ctfleague.ru/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 
}

# ==========================================
# 3. Vault (vault.ctfleague.ru)
# ==========================================
server {
    server_name vault.ctfleague.ru;

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; 
    ssl_certificate /etc/letsencrypt/live/ctfleague.ru/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/ctfleague.ru/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 
}

# ==========================================
# 4. API Backend (api.ctfleague.ru)
# ==========================================
server {
    server_name api.ctfleague.ru;

    # WebSocket — no cache
    location /ws {
        proxy_pass http://127.0.0.1:8090/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Static/rarely-changing public data — nginx proxy cache + browser cache
    # /tags, /fields, /brackets, /challenges/types, /pages, /tos, /privacy, /robots.txt
    location ~* ^/(tags|fields|brackets|challenges/types|pages|tos|privacy|robots\.txt)(/.*)?$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache api_cache;
        proxy_cache_key "$request_method$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout invalid_header updating
                              http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        add_header Cache-Control "public, max-age=600, stale-while-revalidate=60";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Competition status — short TTL (changes during event)
    location = /competition/status {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache api_cache;
        proxy_cache_key "$request_method$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        add_header Cache-Control "public, max-age=30, stale-while-revalidate=10";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Public notifications — short TTL
    location = /notifications {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache api_cache;
        proxy_cache_key "$request_method$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 2m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        add_header Cache-Control "public, max-age=120, stale-while-revalidate=30";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Everything else — no nginx cache, no browser cache
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    listen 443 ssl; 
    ssl_certificate /etc/letsencrypt/live/ctfleague.ru/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/ctfleague.ru/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 
}

# ==========================================
# 5. Grafana (grafana.ctfleague.ru)
# ==========================================
server {
    server_name grafana.ctfleague.ru;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/grafana.ctfleague.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.ctfleague.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 
}

# ==========================================
# 6. SeaweedFS UI (s3.ctfleague.ru)
# ==========================================
server {
    server_name s3.ctfleague.ru;
    client_max_body_size 100M;

    location /filer/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_request_buffering off;
    }

    location /master/ {
        proxy_pass http://127.0.0.1:9333/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ctfleague.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctfleague.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ==========================================
# 7. Frontend (ctfleague.ru)
# ==========================================
server {
    server_name ctfleague.ru www.ctfleague.ru;
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_intercept_errors off;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ctfleague.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctfleague.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ==========================================
# HTTP -> HTTPS Redirect
# ==========================================
server {
    if ($host = gitlab.ctfleague.ru) { return 301 https://$host$request_uri; }
    if ($host = registry.ctfleague.ru) { return 301 https://$host$request_uri; }
    if ($host = vault.ctfleague.ru) { return 301 https://$host$request_uri; }
    if ($host = api.ctfleague.ru) { return 301 https://$host$request_uri; }
    if ($host = grafana.ctfleague.ru) { return 301 https://$host$request_uri; }
    if ($host = s3.ctfleague.ru) { return 301 https://$host$request_uri; }
    if ($host = ctfleague.ru) { return 301 https://$host$request_uri; }
    if ($host = www.ctfleague.ru) { return 301 https://$host$request_uri; }

    listen 80;
    server_name gitlab.ctfleague.ru registry.ctfleague.ru vault.ctfleague.ru api.ctfleague.ru grafana.ctfleague.ru s3.ctfleague.ru ctfleague.ru www.ctfleague.ru;
    return 404;
}
