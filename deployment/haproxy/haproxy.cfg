# CTF Platform - HAProxy 3.x - static configuration
#
# This file contains all non-frontend sections (global, defaults, stick tables,
# backends). The main routing frontend is generated at startup by entrypoint.sh
# based on environment variables, and passed as a second -f argument.
#
# HAProxy is started with:
#   haproxy -f haproxy.cfg -f /tmp/fe_main.cfg -W -db

global
    log         stdout format raw local0 info
    # Keep maxconn below the default container nofile ceiling (65535).
    # HAProxy needs roughly 2 FDs per connection, so 50k would fail on
    # typical VPS defaults with "Cannot raise FD limit".
    maxconn     30000

    # 4 sticky counters: sc0=req_rate, sc1=conn_rate, sc2=err_rate, sc3=submit_rate
    tune.stick-counters 4

    # TLS hardening (applied to all bind directives with ssl)
    ssl-default-bind-options   ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

    stats socket /var/run/haproxy/haproxy.sock mode 660 level admin
    stats timeout 30s

    # Persist server state across graceful reloads (kill -USR2 <master_pid>)
    server-state-file /var/lib/haproxy/server-state

defaults
    mode            http
    log             global
    option          dontlognull
    option          forwardfor
    option          http-server-close

    timeout connect         5s
    timeout client          10m
    timeout server          65s
    timeout tunnel          3600s
    timeout http-request    10s      # Anti-slowloris: abort if headers not received in time
    timeout http-keep-alive 15s
    timeout queue           10s

    retries 2
    load-server-state-from-file global

    compression algo gzip
    compression type application/json application/javascript text/css text/html text/plain image/svg+xml application/manifest+json

    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs {%[var(txn.cache_hit)]} %{+Q}r"

    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 429 /usr/local/etc/haproxy/errors/429.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http

# Stick tables - L7 DDoS defense
#
# These backends hold no servers - they are in-memory data stores used by
# the fe_main frontend (generated by entrypoint.sh) to track per-IP metrics
# and enforce rate limits before requests reach the application layer.

# HTTP req rate per IP (default threshold: 3000/min -> HTTP 429)
backend st_per_ip_rate
    stick-table type ip size 500k expire 2m store http_req_rate(60s)

# TCP conn rate per IP (default threshold: 100/10s -> HTTP 429)
backend st_per_ip_conn
    stick-table type ip size 500k expire 2m store conn_rate(10s)

# HTTP error rate per IP (default threshold: 120/30s -> HTTP 403, 10min block)
backend st_per_ip_err
    stick-table type ip size 500k expire 10m store http_err_rate(30s)

# Flag submit rate per IP (default threshold: 120/min -> HTTP 429)
backend st_submit_abuse
    stick-table type ip size 200k expire 5m store http_req_rate(60s)

# Edge cache sections
#
# short_cache : public API endpoints with Cache-Control from backend (tags, brackets, etc.)
# avatar_cache: avatar images - long TTL, keyed by path which contains the content hash
# scoreboard_cache: scoreboard micro-cache - 5s cap to absorb burst traffic at end of CTF

cache short_cache
    total-max-size 64
    max-object-size 1048576
    max-age 120
    process-vary on

cache avatar_cache
    total-max-size 128
    max-object-size 524288
    max-age 3600
    process-vary on

cache scoreboard_cache
    total-max-size 32
    max-object-size 2097152
    max-age 5
    process-vary on

# Application backends

backend bk_api
    option httpchk GET /api/v1/health
    http-check expect status 200
    server backend backend:8080 check inter 5s rise 2 fall 3

backend bk_api_long
    timeout server  10m
    option httpchk GET /api/v1/health
    http-check expect status 200
    server backend backend:8080 check inter 5s rise 2 fall 3

backend bk_websocket
    timeout server  3600s
    timeout tunnel  3600s
    server backend backend:8080 check inter 5s rise 2 fall 3

backend bk_sse
    timeout server  3600s
    timeout tunnel  3600s
    no option http-buffer-request
    server backend backend:8080 check inter 5s rise 2 fall 3

backend bk_frontend
    option httpchk GET /
    http-check expect status 200
    server frontend frontend:8000 check inter 5s rise 2 fall 3

backend bk_grafana
    server grafana grafana:3000 check inter 10s

backend bk_vault
    server vault vault:8200 check inter 10s

backend bk_seaweedfs_s3
    server seaweedfs_s3 seaweedfs:8333 check inter 10s

backend bk_seaweedfs_admin
    server seaweedfs_admin seaweedfs-admin:23646 check inter 10s

backend bk_acme
    server acme_webroot acme-webroot:8089 check inter 10s
