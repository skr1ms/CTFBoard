# run with: docker compose --env-file .env.local -f deployment/docker/docker-compose.local.yml up --build -d

services:
  vault:
    image: hashicorp/vault:2.0.2
    container_name: vault
    command: server -dev
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_LOG_LEVEL: "debug"
      SKIP_SETCAP: true
    cap_add:
      - IPC_LOCK
    security_opt:
      - no-new-privileges:false
    networks:
      - ctf_platform_network
    restart: unless-stopped

  vault-init:
    image: hashicorp/vault:2.0.2
    container_name: vault-init
    env_file:
      - ../../.env.local
    environment:
      SKIP_SETCAP: true
    volumes:
      - ./init-vault.sh:/init-vault.sh:ro
    entrypoint: /bin/sh
    command: -c "/init-vault.sh"
    depends_on:
      - vault
    networks:
      - ctf_platform_network
    restart: "no"

  postgres:
    image: postgres:18.4-alpine3.23
    container_name: postgres
    command:
      [
        "postgres",
        "-c",
        "max_connections=400",
        "-c",
        "shared_buffers=256MB",
        "-c",
        "work_mem=4MB",
        "-c",
        "effective_cache_size=1GB",
      ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-board}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-board}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ctf_platform_network
    restart: unless-stopped

  redis:
    image: redis:8.8.0-alpine3.23
    container_name: redis
    # Redis stores ephemeral cache / rate-limit state only. Disable RDB/AOF
    # so restricted hosts do not break writes on /data and poison the app
    # with MISCONF / EXECABORT errors.
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis} --save "" --appendonly no --stop-writes-on-bgsave-error no
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ctf_platform_network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD:-redis} redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seaweedfs:
    image: chrislusf/seaweedfs:4.32
    container_name: seaweedfs
    command: >
      server
      -filer
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumePreallocate
      -master.volumeSizeLimitMB=4096
      -volume.max=100
      -metricsPort=9324
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
      - "9324:9324"
    volumes:
      - ../seaweedfs/s3.local.json:/etc/seaweedfs/s3.json:ro
      - seaweed_data:/data
    networks:
      - ctf_platform_network
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://0.0.0.0:9333/cluster/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  seaweedfs-admin:
    image: chrislusf/seaweedfs:4.32
    container_name: seaweedfs-admin
    command: >
      admin
      -masters=seaweedfs:9333
      -port=23646
      -dataDir=/data/admin
    environment:
      WEED_ADMIN_USER: ${SEAWEED_S3_ACCESS_KEY:-admin}
      WEED_ADMIN_PASSWORD: ${SEAWEED_S3_SECRET_KEY:-admin}
    ports:
      - "${SEAWEEDFS_UI_PORT:-5000}:23646"
    volumes:
      - seaweed_admin_data:/data
    networks:
      - ctf_platform_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:23646/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    depends_on:
      seaweedfs:
        condition: service_healthy

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ctf-platform-backend-local}
    container_name: backend
    environment:
      APP_NAME: ${APP_NAME:-CTF Platform}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      STRUCTURED_LOGGER: ${STRUCTURED_LOGGER:-true}
      DEBUG_ENABLED: ${DEBUG_ENABLED:-false}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      SETUP_TOKEN: ${SETUP_TOKEN:-local-setup-token-1234567890123456789012345678901234567890}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      BACKEND_PORT: 8080
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8090}
      MIGRATIONS_PATH: ${MIGRATIONS_PATH:-migrations}
      VERIFY_EMAILS: ${VERIFY_EMAILS:-false}
      COMPETITION_MODE: ${COMPETITION_MODE:-teams_only}
      ALLOW_TEAM_SWITCH: ${ALLOW_TEAM_SWITCH:-true}
      MIN_TEAM_SIZE: ${MIN_TEAM_SIZE:-1}
      MAX_TEAM_SIZE: ${MAX_TEAM_SIZE:-10}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-15}

      # Database - host/port only; credentials come from Vault: ctf-platform/database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-100}
      POSTGRES_MIN_CONNS: ${POSTGRES_MIN_CONNS:-10}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}

      # Redis - host/port only; password comes from Vault: ctf-platform/redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-50}
      REDIS_MIN_IDLE: ${REDIS_MIN_IDLE:-10}
      JWT_ISSUER: ${JWT_ISSUER:-ctf-platform}

      # Vault - required; all secrets below are fetched from here at startup
      VAULT_ADDR: http://vault:8200
      VAULT_BACKEND_TOKEN: ${VAULT_BACKEND_TOKEN:-root}

      # JWT TTLs - non-secret; actual signing keys come from Vault: ctf-platform/jwt
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_HOURS: ${JWT_REFRESH_TTL_HOURS:-72}

      # Email / Resend - non-secret config; API key comes from Vault: ctf-platform/resend
      RESEND_ENABLED: ${RESEND_ENABLED:-false}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@ctf-platform.local}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-CTF Platform}
      RESEND_VERIFY_TTL_HOURS: ${RESEND_VERIFY_TTL_HOURS:-24}
      RESEND_RESET_TTL_HOURS: ${RESEND_RESET_TTL_HOURS:-1}

      # Storage - non-secret config; access/secret keys come from Vault: ctf-platform/storage
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-./uploads}
      STORAGE_S3_ENDPOINT: seaweedfs:8333
      STORAGE_S3_PUBLIC_ENDPOINT: ${STORAGE_S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-ctf}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_USE_SSL: ${STORAGE_S3_USE_SSL:-false}
      STORAGE_PRESIGNED_EXPIRY_MINUTES: ${STORAGE_PRESIGNED_EXPIRY_MINUTES:-60}

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://localhost:5173,http://localhost:5000}

      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      METRICS_ALLOWED_IPS: ${METRICS_ALLOWED_IPS:-172.16.0.0/12}

      RATE_LIMIT_SUBMIT_FLAG: ${RATE_LIMIT_SUBMIT_FLAG:-1000}
      RATE_LIMIT_SUBMIT_FLAG_DURATION: ${RATE_LIMIT_SUBMIT_FLAG_DURATION:-1}

      # OAuth redirect URLs - non-secret; client credentials come from Vault: ctf-platform/oauth
      OAUTH_GITHUB_REDIRECT_URL: ${OAUTH_GITHUB_REDIRECT_URL:-http://localhost:8090/api/v1/auth/oauth/github/callback}
      OAUTH_GOOGLE_REDIRECT_URL: ${OAUTH_GOOGLE_REDIRECT_URL:-http://localhost:8090/api/v1/auth/oauth/google/callback}
    ports:
      - "${BACKEND_PORT:-8090}:8080"
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    networks:
      - ctf_platform_network
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend/board
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-CTF Platform}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/api/v1/ws}
        VITE_SSE_URL: ${VITE_SSE_URL:-http://localhost:8000/api/v1/sse}
    image: ${FRONTEND_IMAGE:-ctf-platform-frontend}
    container_name: frontend
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    networks:
      - ctf_platform_network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9091:9090"
    depends_on:
      alertmanager:
        condition: service_healthy
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ctf_platform_network
    restart: unless-stopped

  loki:
    build:
      context: .
      dockerfile: loki.Dockerfile
    image: astroctfb-loki:dev
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    expose:
      - "3100"
    volumes:
      - ../../monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ctf_platform_network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.32.2
    container_name: alertmanager
    volumes:
      - ../../monitoring/alertmanager/alertmanager.local.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    expose:
      - "9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ctf_platform_network
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.16.3
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../../monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    expose:
      - "12345"
    networks:
      - ctf_platform_network
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.2.9
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards/system:/var/lib/grafana/dashboards/system:ro
      - ../../monitoring/grafana/dashboards/backend:/var/lib/grafana/dashboards/backend:ro
      - ../../monitoring/grafana/dashboards/postgres:/var/lib/grafana/dashboards/postgres:ro
      - ../../monitoring/grafana/dashboards/redis:/var/lib/grafana/dashboards/redis:ro
      - ../../monitoring/grafana/dashboards/vault:/var/lib/grafana/dashboards/vault:ro
      - ../../monitoring/grafana/dashboards/seaweedfs:/var/lib/grafana/dashboards/seaweedfs:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ctf_platform_network
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-board}?sslmode=disable"
    expose:
      - "9187"
    networks:
      - ctf_platform_network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.86.0
    container_name: redis-exporter
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    expose:
      - "9121"
    networks:
      - ctf_platform_network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    command:
      - "-port=8180"
      - "--housekeeping_interval=10s"
      - "--docker_only=true"
    expose:
      - "8180"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - ctf_platform_network
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8180/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node-exporter
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - ctf_platform_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  vault_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
  seaweed_data:
  seaweed_admin_data:

networks:
  ctf_platform_network:
    driver: bridge
