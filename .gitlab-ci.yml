workflow:
  rules:
    - changes:
        - backend/**/*
        - frontend/**/*
        - monitoring/**/*
        - deployment/**/*
        - go.mod
        - go.sum
        - .gitlab-ci.yml
      when: always

    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always

stages:
  - build
  - security
  - test
  - deploy
  - cleanup

variables:
  DOCKER_BUILDKIT: "1"
  DOCKER_CLI_IMAGE: docker:cli

  GOLANG_IMAGE: golang:1.26-alpine
  POSTGRES_IMAGE: postgres:18-alpine
  REDIS_IMAGE: redis:alpine
  GOLANGCI_LINT_IMAGE: golangci/golangci-lint:latest-alpine
  ALPINE_IMAGE: alpine:latest
  GOSEC_IMAGE: securego/gosec:latest
  TRIVY_IMAGE: aquasec/trivy:latest
  BUN_IMAGE: oven/bun:1

  VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8090/api/v1}
  VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8090/api/v1/ws}
  VITE_SSE_URL: ${VITE_SSE_URL:-http://localhost:8090/api/v1/sse}
  VITE_APP_NAME: ${VITE_APP_NAME:-CTF Platform}

  POSTGRES_DB: test_board
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  REDIS_PASSWORD: "test_password"

.docker-login: &docker_login
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

# Build stage

build:frontend:
  stage: build
  image: $DOCKER_CLI_IMAGE
  <<: *docker_login
  allow_failure: false
  script:
    - docker pull "$CI_REGISTRY_IMAGE/frontend:latest" || true
    - |
      docker build \
        --cache-from "$CI_REGISTRY_IMAGE/frontend:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
        --build-arg VITE_WS_URL="$VITE_WS_URL" \
        --build-arg VITE_SSE_URL="$VITE_SSE_URL" \
        --build-arg VITE_APP_NAME="$VITE_APP_NAME" \
        -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" \
        -t "$CI_REGISTRY_IMAGE/frontend:latest" \
        -f frontend/board/Dockerfile \
        frontend/board/
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest"
  rules:
    - changes:
        - frontend/board/**/*

build:backend:
  stage: build
  image: $DOCKER_CLI_IMAGE
  <<: *docker_login
  allow_failure: false
  script:
    - docker pull "$CI_REGISTRY_IMAGE/backend:latest" || true
    - |
      docker build \
        --cache-from "$CI_REGISTRY_IMAGE/backend:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" \
        -t "$CI_REGISTRY_IMAGE/backend:latest" \
        -f backend/Dockerfile \
        backend/
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"
  rules:
    - changes:
        - backend/**/*
        - go.mod
        - go.sum
        - deployment/docker/**/*

build:cleanup:
  stage: build
  image: $GOLANG_IMAGE
  allow_failure: false
  script:
    - cd backend
    - apk add --no-cache make
    - go mod download
    - make build-cleanup
  artifacts:
    paths:
      - backend/bin/ctf-platform-cleanup
    expire_in: 1 hour
  rules:
    - changes:
        - backend/cmd/cleanup/**/*
        - backend/internal/**/*
        - deployment/cron-jobs/**/*
        - .gitlab-ci.yml

# Security stage

lint:frontend:
  stage: security
  image: $BUN_IMAGE
  allow_failure: false
  script:
    - cd frontend/board
    - bun install --frozen-lockfile
    - bun run type-check
    - bun run lint
  rules:
    - changes:
        - frontend/board/**/*

# Lint job
lint:backend:code:
  stage: security
  image: $GOLANG_IMAGE
  allow_failure: false
  variables:
    CGO_ENABLED: "0"
  script:
    - cd backend
    - apk add --no-cache make
    - go mod download
    - make install-tools
    - make lint LINT_TIMEOUT=10m
  rules:
    - changes:
        - backend/**/*
        - go.mod
        - go.sum

# Security code job
security:backend:code:
  stage: security
  allow_failure: false
  image:
    name: $GOSEC_IMAGE
    entrypoint: [""]
  script:
    - cd backend
    - go mod download
    - gosec -exclude=G101 ./...
  rules:
    - changes:
        - backend/**/*
        - go.mod
        - go.sum

security:frontend:container:
  stage: security
  allow_failure: false
  needs:
    - build:frontend
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
  rules:
    - changes:
        - frontend/board/**/*

# Security container job
security:backend:container:
  stage: security
  allow_failure: false
  needs:
    - build:backend
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
  rules:
    - changes:
        - backend/**/*
        - go.mod
        - go.sum
        - deployment/docker/**/*

# Test stage

test:frontend:
  stage: test
  image: $BUN_IMAGE
  allow_failure: false
  script:
    - cd frontend/board
    - bun install --frozen-lockfile
    - bun run test
  rules:
    - changes:
        - frontend/board/**/*

test:backend:
  stage: test
  image: $GOLANG_IMAGE
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres-test
      variables:
        POSTGRES_DB: $POSTGRES_DB
        POSTGRES_USER: $POSTGRES_USER
        POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    - name: $REDIS_IMAGE
      alias: redis-test
      variables:
        REDIS_PASSWORD: $REDIS_PASSWORD

  variables:
    POSTGRES_HOST: postgres-test
    POSTGRES_PORT: "5432"
    REDIS_HOST: redis-test
    REDIS_PORT: "6379"
    JWT_ACCESS_SECRET: test-access-secret-key-for-ci
    JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci
    APP_NAME: CTF Platform
    APP_VERSION: 1.0.0
    LOG_LEVEL: info
    BACKEND_PORT: "8080"
    MIGRATIONS_PATH: migrations
    CGO_ENABLED: "1"
  before_script:
    - apk add --no-cache build-base git make netcat-openbsd postgresql-client

    - |
      echo "Waiting for PostgreSQL..."
      for i in $(seq 1 30); do
        pg_isready -h postgres-test -p 5432 -U $POSTGRES_USER && echo "PostgreSQL is ready!" && break
        echo "Waiting..."
        sleep 2
      done

    - |
      echo "Waiting for Redis..."
      for i in $(seq 1 10); do
        nc -z redis-test 6379 && echo "Redis is ready!" && break
        echo "Waiting..."
        sleep 1
      done

    - cd backend
    - go mod download
  script:
    - make test-race
  rules:
    - changes:
        - backend/**/*
        - go.mod
        - go.sum

# Deploy stage

deploy:backend:
  stage: deploy
  image: $ALPINE_IMAGE
  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - |
      ssh -o StrictHostKeyChecking=accept-new $DEPLOY_USER@$DEPLOY_SERVER_IP "bash -s" << EOF
      set -e

      trap 'docker logout 2>/dev/null; rm -f ~/.docker/config.json' EXIT

      cd ~/ctf-platform

      git fetch origin main
      git reset --hard origin/main

      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

      sed -i '/^BACKEND_IMAGE=/d' .env || true
      echo "BACKEND_IMAGE=$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" >> .env

      sed -i '/^FRONTEND_IMAGE=/d' .env || true
      echo "FRONTEND_IMAGE=$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" >> .env

      docker compose --env-file .env -f deployment/docker/docker-compose.yml pull backend frontend --ignore-pull-failures
      docker compose --env-file .env -f deployment/docker/docker-compose.yml up -d backend frontend haproxy
      docker compose --env-file .env -f deployment/docker/docker-compose.yml restart prometheus loki alertmanager promtail grafana postgres-exporter redis-exporter cadvisor

      echo "Waiting for backend..."
      for i in {1..30}; do
        if curl -sf http://localhost:8090/health > /dev/null 2>&1; then
          echo "Backend is healthy!"
          break
        fi
        if [ \$i -eq 30 ]; then
          echo "Backend failed health check!"
          docker logs backend --tail 50
          exit 1
        fi
        sleep 2
      done

      echo "Waiting for frontend..."
      for i in {1..20}; do
        if docker exec frontend wget --spider -q http://localhost:8000/ > /dev/null 2>&1; then
          echo "Frontend is healthy!"
          break
        fi
        if [ \$i -eq 20 ]; then
          echo "Frontend failed health check!"
          docker logs frontend --tail 50
          exit 1
        fi
        sleep 2
      done

      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/**/*
        - frontend/**/*
        - deployment/**/*
        - monitoring/**/*
        - go.mod
        - go.sum
        - .gitlab-ci.yml
  environment:
    name: production
    url: https://${DEPLOY_DOMAIN}

deploy:cron:
  stage: deploy
  image: $ALPINE_IMAGE
  needs: 
    - job: build:cleanup
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - |
      BIN_SRC="backend/bin/ctf-platform-cleanup"
      CRON_SRC="deployment/cron-jobs/cleanup-cron"
      BIN_DEST="/usr/local/bin/ctf-platform-cleanup"
      CRON_DEST="/etc/cron.d/ctf-platform-cleanup"

      echo "Deploying cleanup tool to $DEPLOY_USER@$DEPLOY_SERVER_IP..."

      scp -p "$BIN_SRC" "$DEPLOY_USER@$DEPLOY_SERVER_IP:/tmp/ctf-platform-cleanup.bin"
      scp -p "$CRON_SRC" "$DEPLOY_USER@$DEPLOY_SERVER_IP:/tmp/ctf-platform-cleanup.cron"

      ssh "$DEPLOY_USER@$DEPLOY_SERVER_IP" "bash -s" << 'EOF'
        set -e

        sudo mv /tmp/ctf-platform-cleanup.bin /usr/local/bin/ctf-platform-cleanup
        sudo chmod +x /usr/local/bin/ctf-platform-cleanup
        sudo chown root:root /usr/local/bin/ctf-platform-cleanup

        sudo mv /tmp/ctf-platform-cleanup.cron /etc/cron.d/ctf-platform-cleanup
        sudo chown root:root /etc/cron.d/ctf-platform-cleanup
        sudo chmod 644 /etc/cron.d/ctf-platform-cleanup

        sudo sed -i -e '$a\' /etc/cron.d/ctf-platform-cleanup

        sudo systemctl reload cron 2>/dev/null || sudo systemctl restart cron
        
        echo "Cron deployment complete."
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/cmd/cleanup/**/*
        - backend/internal/**/*
        - deployment/cron-jobs/**/*
        - .gitlab-ci.yml
  environment:
    name: production
