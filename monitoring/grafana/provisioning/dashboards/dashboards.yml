apiVersion: 1

providers:
  - name: System
    orgid: 1
    folder: System
    type: file
    disableDeletion: true
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/system
      foldersFromFilesStructure: false

